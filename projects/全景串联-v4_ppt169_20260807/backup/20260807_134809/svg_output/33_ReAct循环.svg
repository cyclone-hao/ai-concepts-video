<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowReact" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B6F47"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">ReAct 循环 — Agent 的核心逻辑</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">Think → Act → Observe → Repeat</text>
  </g>

  <!-- Central cycle diagram -->
  <g id="cycle">
    <!-- Think -->
    <rect x="160" y="130" width="280" height="140" rx="16" fill="#FAF7F2" stroke="#8B6F47" stroke-width="2"/>
    <rect x="160" y="130" width="280" height="6" rx="3" fill="#8B6F47"/>
    <use data-icon="tabler-filled/bulb" x="190" y="155" width="32" height="32" fill="#8B6F47"/>
    <text x="235" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" font-weight="bold">Think 思考</text>
    <text x="190" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">分析当前状态</text>
    <text x="190" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">决定下一步做什么</text>
    <text x="190" y="258" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" font-style="italic">"用户要查天气，我需要调用API"</text>

    <!-- Arrow Think → Act -->
    <line x1="440" y1="200" x2="500" y2="200" stroke="#8B6F47" stroke-width="2.5" marker-end="url(#arrowReact)"/>

    <!-- Act -->
    <rect x="520" y="130" width="280" height="140" rx="16" fill="#FAF7F2" stroke="#E8A87C" stroke-width="2"/>
    <rect x="520" y="130" width="280" height="6" rx="3" fill="#E8A87C"/>
    <use data-icon="tabler-filled/pencil" x="550" y="155" width="32" height="32" fill="#E8A87C"/>
    <text x="595" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#E8A87C" font-weight="bold">Act 行动</text>
    <text x="550" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">执行工具调用</text>
    <text x="550" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">搜索、读写文件、API 请求</text>
    <text x="550" y="258" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" font-style="italic">"调用 get_weather('北京')"</text>

    <!-- Arrow Act → Observe -->
    <line x1="800" y1="200" x2="860" y2="200" stroke="#8B6F47" stroke-width="2.5" marker-end="url(#arrowReact)"/>

    <!-- Observe -->
    <rect x="880" y="130" width="280" height="140" rx="16" fill="#FAF7F2" stroke="#8FBC8F" stroke-width="2"/>
    <rect x="880" y="130" width="280" height="6" rx="3" fill="#8FBC8F"/>
    <use data-icon="tabler-filled/eye" x="910" y="155" width="32" height="32" fill="#8FBC8F"/>
    <text x="955" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" font-weight="bold">Observe 观察</text>
    <text x="910" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">查看工具返回的结果</text>
    <text x="910" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">理解新信息</text>
    <text x="910" y="258" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" font-style="italic">"返回: 28°C, 晴天"</text>

    <!-- Loop arrow (Observe back to Think) -->
    <path d="M 1020,270 L 1020,340 Q 1020,370 990,370 L 330,370 Q 300,370 300,340 L 300,280" fill="none" stroke="#C4956A" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowReact)"/>
    <rect x="540" y="350" width="180" height="30" rx="8" fill="#C4956A" fill-opacity="0.15"/>
    <text x="630" y="371" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#C4956A" text-anchor="middle" font-weight="bold">🔄 循环直到任务完成</text>
  </g>

  <!-- Example trace -->
  <g id="example-trace">
    <rect x="60" y="405" width="1160" height="200" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="90" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" font-weight="bold">实际例子：帮你写一份周报</text>

    <text x="90" y="465" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B6F47" font-weight="bold">循环 1:</text>
    <text x="165" y="465" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">Think: 需要知道本周做了什么 → Act: 读取日历和 Git 提交记录 → Observe: 获取到 12 条记录</text>

    <text x="90" y="495" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#E8A87C" font-weight="bold">循环 2:</text>
    <text x="165" y="495" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">Think: 需要分类整理 → Act: 按项目归类，生成大纲 → Observe: 大纲有 5 个部分</text>

    <text x="90" y="525" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8FBC8F" font-weight="bold">循环 3:</text>
    <text x="165" y="525" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">Think: 需要写成文档 → Act: 生成周报 Markdown → Observe: 文档完成</text>

    <text x="90" y="555" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#C4956A" font-weight="bold">循环 4:</text>
    <text x="165" y="555" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">Think: 需要发给老板 → Act: 发送邮件 → Observe: 发送成功 → <tspan fill="#8FBC8F" font-weight="bold">任务完成 ✓</tspan></text>

    <rect x="90" y="575" width="1100" height="20" rx="4" fill="#8B6F47" fill-opacity="0.04"/>
    <text x="640" y="590" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">每个循环都是一次 Think → Act → Observe，直到 Agent 判断任务完成</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">33</text>
  </g>
</svg>
