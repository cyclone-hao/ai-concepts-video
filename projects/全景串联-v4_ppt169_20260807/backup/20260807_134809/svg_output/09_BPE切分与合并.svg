<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">BPE — 字节对编码</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">高频字符先合并</text>
  </g>

  <!-- Top: Token split -->
  <g id="token-split">
    <text x="100" y="130" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" font-weight="bold">Qwen Tokenizer 切分结果</text>

    <!-- 6 colored token blocks -->
    <rect x="100" y="148" width="80" height="52" rx="8" fill="#E8A87C" fill-opacity="0.2" stroke="#E8A87C" stroke-width="1"/>
    <text x="140" y="182" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5D4E37" text-anchor="middle" font-weight="bold">我</text>

    <rect x="195" y="148" width="80" height="52" rx="8" fill="#C4956A" fill-opacity="0.2" stroke="#C4956A" stroke-width="1"/>
    <text x="235" y="182" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5D4E37" text-anchor="middle" font-weight="bold">喜</text>

    <rect x="290" y="148" width="80" height="52" rx="8" fill="#8B6F47" fill-opacity="0.2" stroke="#8B6F47" stroke-width="1"/>
    <text x="330" y="182" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5D4E37" text-anchor="middle" font-weight="bold">欢</text>

    <rect x="385" y="148" width="80" height="52" rx="8" fill="#8FBC8F" fill-opacity="0.2" stroke="#8FBC8F" stroke-width="1"/>
    <text x="425" y="182" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5D4E37" text-anchor="middle" font-weight="bold">吃</text>

    <rect x="480" y="148" width="80" height="52" rx="8" fill="#E8A87C" fill-opacity="0.2" stroke="#E8A87C" stroke-width="1"/>
    <text x="520" y="182" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5D4E37" text-anchor="middle" font-weight="bold">苹</text>

    <rect x="575" y="148" width="80" height="52" rx="8" fill="#C4956A" fill-opacity="0.2" stroke="#C4956A" stroke-width="1"/>
    <text x="615" y="182" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5D4E37" text-anchor="middle" font-weight="bold">果</text>

    <text x="690" y="180" font-family="Georgia, serif" font-size="20" fill="#8B6F47" font-weight="bold">= 6 Tokens</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="230" x2="1220" y2="230" stroke="#EDE5D5" stroke-width="1"/>

  <!-- Bottom: BPE merge process -->
  <g id="bpe-merge">
    <text x="100" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" font-weight="bold">BPE 合并过程</text>

    <!-- Step 1: 人 + 工 → 人工 -->
    <g id="merge-step-1">
      <text x="100" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">Step 1</text>

      <rect x="100" y="335" width="60" height="44" rx="6" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <text x="130" y="364" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#5D4E37" text-anchor="middle">人</text>

      <text x="180" y="362" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B7D6B">+</text>

      <rect x="200" y="335" width="60" height="44" rx="6" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <text x="230" y="364" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#5D4E37" text-anchor="middle">工</text>

      <text x="290" y="362" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#E8A87C">→</text>

      <rect x="320" y="335" width="100" height="44" rx="6" fill="#E8A87C" fill-opacity="0.2" stroke="#E8A87C" stroke-width="1.5"/>
      <text x="370" y="364" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#C4956A" text-anchor="middle" font-weight="bold">人工</text>

      <text x="440" y="362" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8FBC8F">✓ 高频合并</text>
    </g>

    <!-- Step 2: 人工 + 智能 → 人工智能 -->
    <g id="merge-step-2">
      <text x="100" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">Step 2</text>

      <rect x="100" y="435" width="100" height="44" rx="6" fill="#E8A87C" fill-opacity="0.15" stroke="#E8A87C" stroke-width="1"/>
      <text x="150" y="464" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#C4956A" text-anchor="middle">人工</text>

      <text x="220" y="462" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B7D6B">+</text>

      <rect x="240" y="435" width="100" height="44" rx="6" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <text x="290" y="464" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#5D4E37" text-anchor="middle">智能</text>

      <text x="370" y="462" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#E8A87C">→</text>

      <rect x="400" y="435" width="170" height="44" rx="6" fill="#E8A87C" fill-opacity="0.25" stroke="#E8A87C" stroke-width="2"/>
      <text x="485" y="464" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#C4956A" text-anchor="middle" font-weight="bold">人工智能</text>

      <text x="590" y="462" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8FBC8F">✓ 超高频 → 完整Token</text>
    </g>
  </g>

  <!-- Right side: Explanation card -->
  <g id="explanation">
    <rect x="720" y="300" width="500" height="260" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <use data-icon="tabler-filled/bulb" x="745" y="320" width="28" height="28" fill="#8B6F47"/>
    <text x="785" y="342" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" font-weight="bold">BPE 核心思想</text>

    <text x="745" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">统计训练语料中哪些字符经常</text>
    <text x="745" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37"><tspan fill="#E8A87C" font-weight="bold">挨在一起出现</tspan>，就把它们合并</text>
    <text x="745" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">成一个 Token</text>

    <line x1="745" y1="455" x2="1180" y2="455" stroke="#EDE5D5" stroke-width="1"/>

    <text x="745" y="480" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">每个模型的训练数据不同 →</text>
    <text x="745" y="502" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">BPE 统计出的高频组合不同 →</text>
    <text x="745" y="524" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">最终生成的<tspan fill="#8B6F47" font-weight="bold">词表</tspan>就不一样</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">9</text>
  </g>
</svg>
