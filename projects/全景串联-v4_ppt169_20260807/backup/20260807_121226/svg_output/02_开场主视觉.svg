<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Decorative circles -->
  <g id="decoration">
    <circle cx="1100" cy="120" r="180" fill="#E8A87C" fill-opacity="0.06"/>
    <circle cx="180" cy="600" r="140" fill="#8B6F47" fill-opacity="0.04"/>
  </g>

  <g id="header">
    <!-- Title -->
    <text x="640" y="200" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="42" fill="#8B6F47" text-anchor="middle" font-weight="bold">从 GPT、DeepSeek 到 OpenClaw、Hermes</text>
    <rect x="500" y="218" width="280" height="4" rx="2" fill="#E8A87C"/>

    <!-- Subtitle -->
    <text x="640" y="268" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#5D4E37" text-anchor="middle">一期视频打通 AI 底层逻辑</text>
  </g>

  <g id="keyword-cloud">
    <!-- Keyword tags arranged in rows -->
    <!-- Row 1 -->
    <rect x="175" y="330" width="80" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="215" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">LLM</text>

    <rect x="275" y="330" width="90" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="320" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">Token</text>

    <rect x="385" y="330" width="120" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="445" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">Embedding</text>

    <rect x="525" y="330" width="80" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="565" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">RAG</text>

    <rect x="625" y="330" width="100" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="675" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">Prompt</text>

    <rect x="745" y="330" width="90" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="790" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">Agent</text>

    <rect x="855" y="330" width="80" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="895" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">Skill</text>

    <rect x="955" y="330" width="80" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="995" y="354" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">MCP</text>

    <!-- Row 2 -->
    <rect x="295" y="386" width="110" height="36" rx="18" fill="#E8A87C" fill-opacity="0.15" stroke="#E8A87C" stroke-width="1"/>
    <text x="350" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#C4956A" text-anchor="middle" font-weight="bold">Harness</text>

    <rect x="425" y="386" width="120" height="36" rx="18" fill="#E8A87C" fill-opacity="0.15" stroke="#E8A87C" stroke-width="1"/>
    <text x="485" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#C4956A" text-anchor="middle" font-weight="bold">OpenClaw</text>

    <rect x="565" y="386" width="100" height="36" rx="18" fill="#E8A87C" fill-opacity="0.15" stroke="#E8A87C" stroke-width="1"/>
    <text x="615" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#C4956A" text-anchor="middle" font-weight="bold">Hermes</text>

    <rect x="685" y="386" width="140" height="36" rx="18" fill="#E8A87C" fill-opacity="0.15" stroke="#E8A87C" stroke-width="1"/>
    <text x="755" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#C4956A" text-anchor="middle" font-weight="bold">Vibe Coding</text>

    <rect x="845" y="386" width="130" height="36" rx="18" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <text x="910" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">Fine-tuning</text>
  </g>

  <g id="bottom-info">
    <text x="640" y="520" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B" text-anchor="middle">这些词你能准确说出它们的含义吗？</text>
    <text x="640" y="550" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle">能否区分它们跟 DeepSeek、豆包等软件有什么关系？</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="40" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">AI大家学 · 大模型技术篇</text>
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">2</text>
  </g>
</svg>
