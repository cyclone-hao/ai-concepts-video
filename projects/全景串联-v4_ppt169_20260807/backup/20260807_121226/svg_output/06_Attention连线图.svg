<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="34" fill="#8B6F47" font-weight="bold">Attention — 注意力机制</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="end">同时关注远距离信息</text>
  </g>

  <g id="sentence-area">
    <!-- Main sentence with highlighted words -->
    <text x="640" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37" text-anchor="middle">小明在</text>

    <!-- "北京" highlighted -->
    <rect x="476" y="194" width="72" height="40" rx="8" fill="#E8A87C" fill-opacity="0.15"/>
    <text x="512" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" text-anchor="middle" font-weight="bold">北京</text>

    <text x="640" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37" text-anchor="middle">
      <tspan>小明在</tspan><tspan fill="#C4956A" font-weight="bold"> 北京 </tspan><tspan fill="#5D4E37">参加了一场关于</tspan></text>

    <!-- "学术研讨会" highlighted -->
    <text x="925" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" font-weight="bold">学术研讨会</text>

    <!-- Blank -->
    <rect x="1085" y="194" width="80" height="40" rx="8" fill="none" stroke="#E8A87C" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="1125" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#E8A87C" text-anchor="middle">___</text>

    <text x="1180" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">的</text>
  </g>

  <!-- Rebuild sentence properly as single line -->
  <!-- Clear previous and use cleaner approach -->
  <rect x="60" y="170" width="1160" height="80" fill="#F5F0E8"/>

  <g id="sentence-clean">
    <!-- Full sentence as a clean layout -->
    <text x="100" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">小明在</text>

    <!-- 北京 with highlight background -->
    <rect x="215" y="194" width="76" height="38" rx="8" fill="#E8A87C" fill-opacity="0.15"/>
    <text x="220" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" font-weight="bold">北京</text>

    <text x="300" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">参加了一场关于</text>

    <!-- Blank target -->
    <rect x="605" y="194" width="80" height="38" rx="8" fill="none" stroke="#E8A87C" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="645" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#E8A87C" text-anchor="middle">___</text>

    <text x="695" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">的</text>

    <!-- 学术研讨会 with highlight -->
    <rect x="726" y="194" width="160" height="38" rx="8" fill="#E8A87C" fill-opacity="0.15"/>
    <text x="732" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" font-weight="bold">学术研讨会</text>

    <text x="896" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">。</text>
  </g>

  <g id="attention-arcs">
    <!-- Arc from "北京" to blank -->
    <path d="M 253 235 C 253 350 645 350 645 235" fill="none" stroke="#E8A87C" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="420" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#E8A87C" font-weight="bold">Attention</text>

    <!-- Arc from "学术研讨会" to blank -->
    <path d="M 806 235 C 806 310 645 310 645 235" fill="none" stroke="#C4956A" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="710" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#C4956A" font-weight="bold">Attention</text>

    <!-- Small arrowheads at blank end -->
    <polygon points="645,234 640,244 650,244" fill="#E8A87C"/>
  </g>

  <g id="explanation">
    <rect x="100" y="400" width="1080" height="220" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>

    <use data-icon="tabler-filled/bulb" x="130" y="430" width="36" height="36" fill="#8B6F47"/>
    <text x="180" y="455" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" font-weight="bold">Attention 的核心能力</text>

    <text x="130" y="500" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">要填这个空，模型不能只看"关于"后面的内容</text>
    <text x="130" y="530" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">它需要<tspan fill="#C4956A" font-weight="bold">同时关注</tspan>到<tspan fill="#C4956A" font-weight="bold">"北京"</tspan>和<tspan fill="#C4956A" font-weight="bold">"学术研讨会"</tspan>这两个关键信息</text>
    <text x="130" y="560" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">把它们<tspan fill="#E8A87C" font-weight="bold">综合起来</tspan>判断空白处应该填什么</text>
    <text x="130" y="596" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8B7D6B">这个"同时看到并关联远距离信息"的能力，就是 Attention</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">6</text>
  </g>
</svg>
