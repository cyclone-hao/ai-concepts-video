<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="34" fill="#8B6F47" font-weight="bold">LLM 的核心：预测下一个词</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
  </g>

  <g id="sentence">
    <!-- Main sentence -->
    <text x="640" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" fill="#5D4E37" text-anchor="middle">今天天气真好，我们去公园</text>
    <!-- Blank indicator -->
    <rect x="870" y="150" width="100" height="44" rx="8" fill="none" stroke="#E8A87C" stroke-width="2.5" stroke-dasharray="8,4"/>
    <text x="920" y="180" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#E8A87C" text-anchor="middle">___</text>
  </g>

  <g id="candidates">
    <!-- Candidate 1: 散步 (highest probability) -->
    <g id="bubble-1">
      <rect x="200" y="280" width="220" height="160" rx="20" fill="#FAF7F2" stroke="#E8A87C" stroke-width="2"/>
      <text x="310" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" fill="#5D4E37" text-anchor="middle" font-weight="bold">散步</text>
      <text x="310" y="395" font-family="Georgia, serif" font-size="42" fill="#E8A87C" text-anchor="middle" font-weight="bold">45%</text>
      <text x="310" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">最高概率</text>
    </g>

    <!-- Candidate 2: 玩 -->
    <g id="bubble-2">
      <rect x="480" y="280" width="220" height="160" rx="20" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <text x="590" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" fill="#5D4E37" text-anchor="middle" font-weight="bold">玩</text>
      <text x="590" y="395" font-family="Georgia, serif" font-size="42" fill="#8B6F47" text-anchor="middle" font-weight="bold">30%</text>
    </g>

    <!-- Candidate 3: 跑步 -->
    <g id="bubble-3">
      <rect x="760" y="280" width="220" height="160" rx="20" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <text x="870" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" fill="#5D4E37" text-anchor="middle" font-weight="bold">跑步</text>
      <text x="870" y="395" font-family="Georgia, serif" font-size="42" fill="#8B6F47" text-anchor="middle" font-weight="bold">15%</text>
    </g>

    <!-- Other low probability -->
    <text x="1050" y="370" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">其他 ~10%</text>
  </g>

  <g id="explanation">
    <rect x="100" y="500" width="1080" height="100" rx="16" fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1"/>
    <use data-icon="tabler-filled/bulb" x="130" y="525" width="36" height="36" fill="#8B6F47"/>
    <text x="185" y="540" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5D4E37" font-weight="bold">LLM 做的事情和你一样</text>
    <text x="185" y="572" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">通过一个复杂的数学函数，基于训练时看过的<tspan fill="#8B6F47" font-weight="bold">几千亿字</tspan>的文本，算出每个候选词的概率</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">5</text>
  </g>
</svg>
