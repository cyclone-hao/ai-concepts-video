<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">Function Calling 工作流程</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">AI 学会用工具</text>
  </g>

  <!-- User question -->
  <g id="user-question">
    <rect x="60" y="105" width="1160" height="60" rx="12" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <use data-icon="tabler-filled/user" x="85" y="117" width="28" height="28" fill="#8B6F47"/>
    <text x="125" y="142" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">用户提问：</text>
    <text x="250" y="142" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">"北京今天天气怎么样？"</text>
  </g>

  <!-- Step 1: 模型识别需要工具 -->
  <g id="step-1">
    <rect x="60" y="185" width="360" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <rect x="60" y="185" width="360" height="6" rx="3" fill="#8B6F47"/>

    <rect x="80" y="210" width="40" height="40" rx="20" fill="#8B6F47"/>
    <text x="100" y="238" font-family="Georgia, serif" font-size="18" fill="#FAF7F2" text-anchor="middle" font-weight="bold">1</text>
    <text x="135" y="236" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" font-weight="bold">模型识别</text>

    <text x="80" y="275" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">模型知道自己不知道天气</text>
    <text x="80" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">但看到可用的工具列表：</text>

    <rect x="80" y="320" width="320" height="110" rx="8" fill="#F0EBE0"/>
    <text x="95" y="345" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8B6F47" font-weight="bold">tools: [</text>
    <text x="110" y="365" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">{ "name": "get_weather",</text>
    <text x="120" y="385" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  "desc": "获取城市天气",</text>
    <text x="120" y="405" font-family="Consolas, Courier New, monospace" font-size="12" fill="#E8A87C">  "params": {"city": "str"}</text>
    <text x="95" y="425" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8B6F47" font-weight="bold">}</text>
  </g>

  <!-- Arrow 1→2 -->
  <text x="430" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#8B7D6B">→</text>

  <!-- Step 2: 生成工具调用 -->
  <g id="step-2">
    <rect x="460" y="185" width="360" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <rect x="460" y="185" width="360" height="6" rx="3" fill="#E8A87C"/>

    <rect x="480" y="210" width="40" height="40" rx="20" fill="#E8A87C"/>
    <text x="500" y="238" font-family="Georgia, serif" font-size="18" fill="#FAF7F2" text-anchor="middle" font-weight="bold">2</text>
    <text x="535" y="236" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#E8A87C" font-weight="bold">生成调用指令</text>

    <text x="480" y="275" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">模型不直接回答，</text>
    <text x="480" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">而是输出一段 JSON：</text>

    <rect x="480" y="320" width="320" height="110" rx="8" fill="#F0EBE0"/>
    <text x="495" y="345" font-family="Consolas, Courier New, monospace" font-size="12" fill="#E8A87C" font-weight="bold">tool_call: {</text>
    <text x="510" y="365" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  "function": "get_weather",</text>
    <text x="510" y="385" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  "arguments": {</text>
    <text x="520" y="405" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">    "city": "北京"</text>
    <text x="510" y="425" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  }</text>
  </g>

  <!-- Arrow 2→3 -->
  <text x="830" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#8B7D6B">→</text>

  <!-- Step 3: 执行并返回 -->
  <g id="step-3">
    <rect x="860" y="185" width="360" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <rect x="860" y="185" width="360" height="6" rx="3" fill="#8FBC8F"/>

    <rect x="880" y="210" width="40" height="40" rx="20" fill="#8FBC8F"/>
    <text x="900" y="238" font-family="Georgia, serif" font-size="18" fill="#FAF7F2" text-anchor="middle" font-weight="bold">3</text>
    <text x="935" y="236" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" font-weight="bold">执行并回答</text>

    <text x="880" y="275" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">你的代码调用真实 API</text>
    <text x="880" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">把结果喂回模型：</text>

    <rect x="880" y="320" width="320" height="110" rx="8" fill="#F0EBE0"/>
    <text x="895" y="345" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8FBC8F" font-weight="bold">tool_result: {</text>
    <text x="910" y="365" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  "temp": "28°C",</text>
    <text x="910" y="385" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  "condition": "晴",</text>
    <text x="910" y="405" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5D4E37">  "humidity": "45%"</text>
    <text x="895" y="425" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8FBC8F" font-weight="bold">}</text>

    <text x="880" y="455" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">模型基于真实数据生成回答</text>
  </g>

  <!-- Bottom summary -->
  <g id="summary">
    <rect x="60" y="490" width="1160" height="60" rx="12" fill="#E8A87C" fill-opacity="0.1" stroke="#E8A87C" stroke-width="1.5"/>
    <use data-icon="tabler-filled/bulb" x="90" y="505" width="28" height="28" fill="#E8A87C"/>
    <text x="130" y="522" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">模型自己不会查天气</text>
    <text x="360" y="522" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8B7D6B">它只是学会了"在合适的时候调用工具"，然后把结果整合成自然语言</text>
  </g>

  <!-- Key point -->
  <g id="keypoint">
    <rect x="60" y="570" width="1160" height="55" rx="12" fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1"/>
    <text x="640" y="603" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" text-anchor="middle" font-weight="bold">Function Calling = 模型输出 JSON 指令 → 外部代码执行 → 结果返回模型 → 模型生成最终回答</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">28</text>
  </g>
</svg>
