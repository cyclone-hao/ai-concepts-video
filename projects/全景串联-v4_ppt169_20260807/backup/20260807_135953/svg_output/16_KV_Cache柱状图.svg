<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">KV Cache — 为什么多轮对话越来越慢？</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">显存占用随对话轮次增长</text>
  </g>

  <g id="chart-area">
    <!-- Y-axis label -->
    <text x="55" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle" transform="rotate(-90, 55, 350)">KV Cache 显存占用</text>

    <!-- Y-axis -->
    <line x1="120" y1="110" x2="120" y2="560" stroke="#EDE5D5" stroke-width="1.5"/>
    <!-- X-axis -->
    <line x1="120" y1="560" x2="1140" y2="560" stroke="#EDE5D5" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="120" y1="450" x2="1140" y2="450" stroke="#EDE5D5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="120" y1="340" x2="1140" y2="340" stroke="#EDE5D5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="120" y1="230" x2="1140" y2="230" stroke="#EDE5D5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="120" y1="120" x2="1140" y2="120" stroke="#EDE5D5" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Y-axis labels -->
    <text x="110" y="564" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="end">0</text>
    <text x="110" y="454" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="end">5 GB</text>
    <text x="110" y="344" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="end">10 GB</text>
    <text x="110" y="234" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="end">15 GB</text>
    <text x="110" y="124" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="end">20+ GB</text>

    <!-- chart-plot-area: x_min,y_min,x_max,y_max -->
    <!-- chart-plot-area: 120,110,1140,560 -->

    <!-- Bars: 10 rounds, increasing height -->
    <!-- Round 1: ~1GB → height ~22 -->
    <rect x="150" y="538" width="70" height="22" rx="4" fill="#E8A87C" fill-opacity="0.3"/>
    <text x="185" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">1轮</text>
    <text x="185" y="532" font-family="Consolas, Courier New, monospace" font-size="10" fill="#8B6F47" text-anchor="middle">~1</text>

    <!-- Round 2: ~2GB -->
    <rect x="250" y="516" width="70" height="44" rx="4" fill="#E8A87C" fill-opacity="0.35"/>
    <text x="285" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">2轮</text>
    <text x="285" y="510" font-family="Consolas, Courier New, monospace" font-size="10" fill="#8B6F47" text-anchor="middle">~2</text>

    <!-- Round 3: ~3.5GB -->
    <rect x="350" y="483" width="70" height="77" rx="4" fill="#E8A87C" fill-opacity="0.4"/>
    <text x="385" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">3轮</text>

    <!-- Round 4: ~5GB -->
    <rect x="450" y="450" width="70" height="110" rx="4" fill="#E8A87C" fill-opacity="0.5"/>
    <text x="485" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">4轮</text>

    <!-- Round 5: ~8GB -->
    <rect x="550" y="384" width="70" height="176" rx="4" fill="#C4956A" fill-opacity="0.5"/>
    <text x="585" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">5轮</text>
    <text x="585" y="378" font-family="Consolas, Courier New, monospace" font-size="10" fill="#C4956A" text-anchor="middle">~8</text>

    <!-- Round 6: ~10GB -->
    <rect x="650" y="340" width="70" height="220" rx="4" fill="#C4956A" fill-opacity="0.55"/>
    <text x="685" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">6轮</text>

    <!-- Round 7: ~13GB -->
    <rect x="750" y="274" width="70" height="286" rx="4" fill="#8B6F47" fill-opacity="0.5"/>
    <text x="785" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">7轮</text>

    <!-- Round 8: ~16GB -->
    <rect x="850" y="208" width="70" height="352" rx="4" fill="#8B6F47" fill-opacity="0.6"/>
    <text x="885" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">8轮</text>

    <!-- Round 9: ~18GB -->
    <rect x="950" y="164" width="70" height="396" rx="4" fill="#8B6F47" fill-opacity="0.7"/>
    <text x="985" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">9轮</text>

    <!-- Round 10: ~20+GB -->
    <rect x="1050" y="120" width="70" height="440" rx="4" fill="#D4837F" fill-opacity="0.7"/>
    <text x="1085" y="580" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8B7D6B" text-anchor="middle">10轮</text>
    <text x="1085" y="114" font-family="Consolas, Courier New, monospace" font-size="11" fill="#D4837F" text-anchor="middle" font-weight="bold">20+GB</text>
  </g>

  <!-- X-axis label -->
  <text x="630" y="610" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">对话轮次</text>

  <!-- Bottom note -->
  <g id="note">
    <rect x="120" y="630" width="1020" height="40" rx="8" fill="#8B6F47" fill-opacity="0.06"/>
    <text x="630" y="656" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle">不是模型变笨了，是<tspan fill="#D4837F" font-weight="bold">"记忆"的物理代价</tspan>在增长</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">16</text>
  </g>
</svg>
