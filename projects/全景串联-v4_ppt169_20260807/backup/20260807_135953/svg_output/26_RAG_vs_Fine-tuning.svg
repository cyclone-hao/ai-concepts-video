<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">RAG vs Fine-tuning</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
  </g>

  <!-- VS label -->
  <rect x="585" y="270" width="110" height="40" rx="20" fill="#8B6F47"/>
  <text x="640" y="297" font-family="Georgia, serif" font-size="20" fill="#FAF7F2" text-anchor="middle" font-weight="bold">VS</text>

  <!-- Left: RAG -->
  <g id="rag-side">
    <rect x="60" y="110" width="500" height="420" rx="16" fill="#FAF7F2" stroke="#8FBC8F" stroke-width="2"/>
    <rect x="60" y="110" width="500" height="6" rx="3" fill="#8FBC8F"/>

    <use data-icon="tabler-filled/book" x="90" y="135" width="36" height="36" fill="#8FBC8F"/>
    <text x="140" y="160" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#8B6F47" font-weight="bold">RAG</text>

    <rect x="90" y="180" width="440" height="50" rx="10" fill="#8FBC8F" fill-opacity="0.1"/>
    <text x="310" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" text-anchor="middle" font-weight="bold">= 开卷考试 📖</text>

    <text x="90" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">给你参考资料，照着回答</text>

    <line x1="90" y1="285" x2="530" y2="285" stroke="#EDE5D5" stroke-width="1"/>

    <text x="90" y="315" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">✅ 成本低（无需 GPU 训练）</text>
    <text x="90" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">✅ 可随时更新资料</text>
    <text x="90" y="375" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">✅ 有引用来源，可追溯</text>
    <text x="90" y="405" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">⚠ 回答速度受检索影响</text>
    <text x="90" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">⚠ 检索质量直接决定回答质量</text>

    <rect x="90" y="465" width="440" height="35" rx="8" fill="#8FBC8F" fill-opacity="0.08"/>
    <text x="310" y="488" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">2025-2026 企业 AI 落地最多的场景</text>
  </g>

  <!-- Right: Fine-tuning -->
  <g id="finetune-side">
    <rect x="720" y="110" width="500" height="420" rx="16" fill="#FAF7F2" stroke="#E8A87C" stroke-width="2"/>
    <rect x="720" y="110" width="500" height="6" rx="3" fill="#E8A87C"/>

    <use data-icon="tabler-filled/bulb" x="750" y="135" width="36" height="36" fill="#E8A87C"/>
    <text x="800" y="160" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" fill="#8B6F47" font-weight="bold">Fine-tuning</text>

    <rect x="750" y="180" width="440" height="50" rx="10" fill="#E8A87C" fill-opacity="0.1"/>
    <text x="970" y="212" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" text-anchor="middle" font-weight="bold">= 上课学习 🎓</text>

    <text x="750" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">用数据继续训练，知识"烧进"权重</text>

    <line x1="750" y1="285" x2="1190" y2="285" stroke="#EDE5D5" stroke-width="1"/>

    <text x="750" y="315" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">✅ 回答更快更自然</text>
    <text x="750" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">✅ 学会行业术语和表达风格</text>
    <text x="750" y="375" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">⚠ 成本高（需要 GPU 训练）</text>
    <text x="750" y="405" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">⚠ 更新知识得重新训练</text>
    <text x="750" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">⚠ 无法引用来源</text>

    <rect x="750" y="465" width="440" height="35" rx="8" fill="#E8A87C" fill-opacity="0.08"/>
    <text x="970" y="488" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">适合学习领域术语和表达风格</text>
  </g>

  <!-- Bottom insight -->
  <g id="insight">
    <rect x="60" y="555" width="1160" height="65" rx="12" fill="#E8A87C" fill-opacity="0.1" stroke="#E8A87C" stroke-width="1.5"/>
    <use data-icon="tabler-filled/bulb" x="90" y="570" width="28" height="28" fill="#E8A87C"/>
    <text x="130" y="594" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">实际项目经常结合使用</text>
    <text x="390" y="594" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">Fine-tuning 学会术语风格 + RAG 提供具体事实信息</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">26</text>
  </g>
</svg>
