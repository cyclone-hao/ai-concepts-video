    <text x="640" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle">搜索引擎负责找到相关资料，大模型负责把资料"翻译"成人话回答你</text>
