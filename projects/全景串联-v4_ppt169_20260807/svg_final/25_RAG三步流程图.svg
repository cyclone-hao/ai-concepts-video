      <text x="1030" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" text-anchor="middle" font-weight="bold">💬 有据可查的回答</text>

      <text x="880" y="480" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">不是凭空编造，基于真实文档</text>
