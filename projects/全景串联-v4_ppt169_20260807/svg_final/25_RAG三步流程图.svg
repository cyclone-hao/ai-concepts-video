  <g id="summary">
    <path fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1" d="M72,540 H1208 A12,12 0 0 1 1220,552 V598 A12,12 0 0 1 1208,610 H72 A12,12 0 0 1 60,598 V552 A12,12 0 0 1 72,540 Z" />
