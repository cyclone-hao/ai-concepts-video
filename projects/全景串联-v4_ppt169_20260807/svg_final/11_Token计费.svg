<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8" />

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">Token 计费实例</text>
    <path fill="#E8A87C" d="M61.50,78 H138.50 A1.50,1.50 0 0 1 140,79.50 V79.50 A1.50,1.50 0 0 1 138.50,81 H61.50 A1.50,1.50 0 0 1 60,79.50 V79.50 A1.50,1.50 0 0 1 61.50,78 Z" />
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">DeepSeek-V3 官方定价</text>
  </g>

  
  <g id="calc-card">
    <path fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1.5" d="M160,110 H1120 A20,20 0 0 1 1140,130 V530 A20,20 0 0 1 1120,550 H160 A20,20 0 0 1 140,530 V130 A20,20 0 0 1 160,110 Z" />

    
    <path fill="#8B6F47" d="M160,110 H1120 A20,20 0 0 1 1140,130 V150 A20,20 0 0 1 1120,170 H160 A20,20 0 0 1 140,150 V130 A20,20 0 0 1 160,110 Z" />
    <rect x="140" y="150" width="1000" height="20" fill="#8B6F47" />
    
  <g transform="translate(175.0, 120.0) scale(1.3333333333333333)" fill="#FAF7F2">
    <path d="M19 5a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-14a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3zm-7 4a3 3 0 0 0 -2.996 2.85l-.004 .15a3 3 0 1 0 3 -3m6.01 2h-.01a1 1 0 0 0 0 2h.01a1 1 0 0 0 0 -2m-12 0h-.01a1 1 0 1 0 .01 2a1 1 0 0 0 0 -2" />
  </g>
    <text x="220" y="147" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#FAF7F2" font-weight="bold">DeepSeek-V3 调用费用计算</text>

    
    <g id="calc-input">
      <path fill="#8FBC8F" fill-opacity="0.15" d="M186,195 H264 A6,6 0 0 1 270,201 V219 A6,6 0 0 1 264,225 H186 A6,6 0 0 1 180,219 V201 A6,6 0 0 1 186,195 Z" />
      <text x="225" y="216" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8FBC8F" text-anchor="middle" font-weight="bold">输入</text>
      <text x="290" y="216" font-family="Consolas, Courier New, monospace" font-size="16" fill="#5D4E37">50 Token × ¥2 / 百万 Token</text>
      <text x="880" y="216" font-family="Consolas, Courier New, monospace" font-size="16" fill="#5D4E37">=</text>
      <text x="920" y="216" font-family="Georgia, serif" font-size="20" fill="#8B6F47" font-weight="bold">¥0.0001</text>
    </g>

    
    <g id="calc-output">
      <path fill="#E8A87C" fill-opacity="0.15" d="M186,245 H264 A6,6 0 0 1 270,251 V269 A6,6 0 0 1 264,275 H186 A6,6 0 0 1 180,269 V251 A6,6 0 0 1 186,245 Z" />
      <text x="225" y="266" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#E8A87C" text-anchor="middle" font-weight="bold">输出</text>
      <text x="290" y="266" font-family="Consolas, Courier New, monospace" font-size="16" fill="#5D4E37">500 Token × ¥8 / 百万 Token</text>
      <text x="880" y="266" font-family="Consolas, Courier New, monospace" font-size="16" fill="#5D4E37">=</text>
      <text x="920" y="266" font-family="Georgia, serif" font-size="20" fill="#8B6F47" font-weight="bold">¥0.004</text>
    </g>

    
    <line x1="180" y1="300" x2="1100" y2="300" stroke="#EDE5D5" stroke-width="1.5" />

    
    <g id="calc-total">
      <text x="290" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5D4E37" font-weight="bold">单次调用合计：</text>
      <text x="920" y="345" font-family="Georgia, serif" font-size="32" fill="#E8A87C" font-weight="bold">¥0.004</text>
      <text x="1060" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">不到半分钱</text>
    </g>

    
    <g id="calc-monthly">
      <path fill="#E8A87C" fill-opacity="0.08" stroke="#E8A87C" stroke-width="1" d="M190,370 H1090 A10,10 0 0 1 1100,380 V420 A10,10 0 0 1 1090,430 H190 A10,10 0 0 1 180,420 V380 A10,10 0 0 1 190,370 Z" />
      <text x="210" y="395" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">每日 <tspan font-weight="bold">10万次</tspan> 调用 × 30天 ≈</text>
      <text x="820" y="402" font-family="Georgia, serif" font-size="28" fill="#C4956A" font-weight="bold">¥12,000 / 月</text>
    </g>

    
    <text x="210" y="465" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">换成 GPT-5.6 同样的调用量一个月要好几万</text>
    <text x="210" y="492" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">⚠ 同样的内容，中文消耗 Token 通常比英文多 1.5 到 2 倍</text>
  </g>

  
  <g id="insight">
    <path fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1" d="M152,575 H1128 A12,12 0 0 1 1140,587 V628 A12,12 0 0 1 1128,640 H152 A12,12 0 0 1 140,628 V587 A12,12 0 0 1 152,575 Z" />
    
  <g transform="translate(165.0, 590.0) scale(1.1666666666666667)" fill="#8B6F47">
    <path d="M4 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M21 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M4.893 4.893a1 1 0 0 1 1.32 -.083l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 0 -1.414z" />
    <path d="M17.693 4.893a1 1 0 0 1 1.497 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7z" />
    <path d="M14 18a1 1 0 0 1 1 1a3 3 0 0 1 -6 0a1 1 0 0 1 .883 -.993l.117 -.007h4z" />
    <path d="M12 6a6 6 0 0 1 3.6 10.8a1 1 0 0 1 -.471 .192l-.129 .008h-6a1 1 0 0 1 -.6 -.2a6 6 0 0 1 3.6 -10.8z" />
  </g>
    <text x="205" y="607" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37" font-weight="bold">Token 直接决定使用成本</text>
    <text x="205" y="628" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">中文场景下成本控制更重要 — 选对模型和 Tokenizer 是关键</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">11</text>
  </g>
</svg>