<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background: black for typewriter effect -->
  <rect width="1280" height="720" fill="#1A1A1A"/>

  <g id="content">
    <!-- Typewriter lines -->
    <g id="line-2023">
      <text x="160" y="200" font-family="Consolas, Courier New, monospace" font-size="24" fill="#FAF7F2">
        <tspan fill="#8B7D6B">2023 年，</tspan>你说你会用 ChatGPT，你就是<tspan fill="#E8A87C" font-weight="bold">科技达人</tspan>。
      </text>
    </g>

    <g id="line-2024">
      <text x="160" y="290" font-family="Consolas, Courier New, monospace" font-size="24" fill="#FAF7F2">
        <tspan fill="#8B7D6B">2024 年，</tspan>你说你会写 Prompt，你就是<tspan fill="#E8A87C" font-weight="bold">行业专家</tspan>。
      </text>
    </g>

    <g id="line-2025">
      <text x="160" y="380" font-family="Consolas, Courier New, monospace" font-size="24" fill="#FAF7F2">
        <tspan fill="#8B7D6B">2025 年，</tspan>你说你懂 Agent，你就是<tspan fill="#E8A87C" font-weight="bold">技术大牛</tspan>。
      </text>
    </g>

    <g id="line-2026">
      <text x="160" y="470" font-family="Consolas, Courier New, monospace" font-size="24" fill="#FAF7F2">
        <tspan fill="#8B7D6B">2026 年，</tspan>你打开 AI 圈，看到<tspan fill="#E8A87C" font-weight="bold"> Harness、OpenClaw、Hermes</tspan>——
      </text>
      <text x="160" y="520" font-family="Consolas, Courier New, monospace" font-size="28" fill="#E8A87C" font-weight="bold">这是啥？</text>
    </g>

    <!-- Blinking cursor indicator -->
    <rect x="295" y="498" width="14" height="28" fill="#FAF7F2" fill-opacity="0.8"/>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" fill-opacity="0.5" text-anchor="end">1</text>
  </g>
</svg>
