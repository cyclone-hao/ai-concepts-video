<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8" />

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">Embedding — 语义空间可视化</text>
    <path fill="#E8A87C" d="M61.50,78 H138.50 A1.50,1.50 0 0 1 140,79.50 V79.50 A1.50,1.50 0 0 1 138.50,81 H61.50 A1.50,1.50 0 0 1 60,79.50 V79.50 A1.50,1.50 0 0 1 61.50,78 Z" />
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">语义越近，距离越近</text>
  </g>

  
  <g id="vector-space">
    
    <line x1="100" y1="600" x2="100" y2="100" stroke="#EDE5D5" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="100" y1="600" x2="750" y2="600" stroke="#EDE5D5" stroke-width="1" stroke-dasharray="4,4" />

    
    <g id="cluster-fruit">
      <circle cx="220" cy="200" r="40" fill="#E8A87C" fill-opacity="0.08" />
      <circle cx="220" cy="200" r="8" fill="#E8A87C" />
      <text x="240" y="195" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">苹果</text>

      <circle cx="300" cy="170" r="8" fill="#E8A87C" />
      <text x="320" y="165" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">香蕉</text>

      <circle cx="340" cy="240" r="8" fill="#E8A87C" />
      <text x="360" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">橙子</text>

      <circle cx="250" cy="280" r="10" fill="#C4956A" />
      <text x="270" y="275" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#C4956A" font-weight="bold">水果</text>

      
      <line x1="220" y1="200" x2="300" y2="170" stroke="#E8A87C" stroke-width="0.5" stroke-opacity="0.3" />
      <line x1="220" y1="200" x2="340" y2="240" stroke="#E8A87C" stroke-width="0.5" stroke-opacity="0.3" />
      <line x1="300" y1="170" x2="340" y2="240" stroke="#E8A87C" stroke-width="0.5" stroke-opacity="0.3" />
    </g>

    
    <g id="cluster-vehicle">
      <circle cx="550" cy="450" r="35" fill="#8FBC8F" fill-opacity="0.08" />
      <circle cx="530" cy="430" r="8" fill="#8FBC8F" />
      <text x="550" y="425" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">汽车</text>

      <circle cx="600" cy="470" r="8" fill="#8FBC8F" />
      <text x="620" y="465" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">卡车</text>

      <circle cx="560" cy="520" r="8" fill="#8FBC8F" />
      <text x="580" y="515" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">公交</text>

      <line x1="530" y1="430" x2="600" y2="470" stroke="#8FBC8F" stroke-width="0.5" stroke-opacity="0.3" />
      <line x1="600" y1="470" x2="560" y2="520" stroke="#8FBC8F" stroke-width="0.5" stroke-opacity="0.3" />
    </g>

    
    
    <line x1="220" y1="200" x2="250" y2="280" stroke="#8FBC8F" stroke-width="2" stroke-dasharray="6,3" />
    <path fill="#8FBC8F" fill-opacity="0.2" d="M192,235 H223 A12,12 0 0 1 235,247 V247 A12,12 0 0 1 223,259 H192 A12,12 0 0 1 180,247 V247 A12,12 0 0 1 192,235 Z" />
    <text x="207" y="252" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8FBC8F" text-anchor="middle" font-weight="bold">近 ✓</text>

    
    <line x1="220" y1="200" x2="530" y2="430" stroke="#D4837F" stroke-width="2" stroke-dasharray="6,3" />
    <path fill="#D4837F" fill-opacity="0.2" d="M352,300 H383 A12,12 0 0 1 395,312 V312 A12,12 0 0 1 383,324 H352 A12,12 0 0 1 340,312 V312 A12,12 0 0 1 352,300 Z" />
    <text x="367" y="317" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#D4837F" text-anchor="middle" font-weight="bold">远 ✗</text>
  </g>

  
  <g id="explanation">
    <path fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1" d="M806,100 H1204 A16,16 0 0 1 1220,116 V604 A16,16 0 0 1 1204,620 H806 A16,16 0 0 1 790,604 V116 A16,16 0 0 1 806,100 Z" />

    
  <g transform="translate(820.0, 125.0) scale(1.3333333333333333)" fill="#8B6F47">
    <path d="M21.165 16a10 10 0 0 1 -8.434 5.973a1 1 0 0 0 .617 -.444a18 18 0 0 0 2.28 -5.528z" />
    <path d="M8.372 16a18 18 0 0 0 2.28 5.53a1 1 0 0 0 .616 .443a10 10 0 0 1 -8.433 -5.973z" />
    <path d="M13.57 16a16 16 0 0 1 -1.57 3.884a16 16 0 0 1 -1.57 -3.884" />
    <path d="M8.034 10a18 18 0 0 0 0 4h-5.832a10 10 0 0 1 -.002 -4z" />
    <path d="M13.952 10a16 16 0 0 1 0 4h-3.904a16 16 0 0 1 0 -4z" />
    <path d="M21.8 10a10.05 10.05 0 0 1 -.002 4h-5.832c.149 -1.329 .149 -2.67 0 -4z" />
    <path d="M11.267 2.027a1 1 0 0 0 -.615 .444a18 18 0 0 0 -2.28 5.529h-5.54a10.01 10.01 0 0 1 8.334 -5.967z" />
    <path d="M12 4.116a16 16 0 0 1 1.57 3.885h-3.14c.34 -1.317 .85 -2.6 1.53 -3.817z" />
    <path d="M12.733 2.026a10.01 10.01 0 0 1 8.435 5.974h-5.54a18 18 0 0 0 -2.28 -5.53a1 1 0 0 0 -.517 -.414z" />
  </g>
    <text x="865" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" font-weight="bold">Embedding 原理</text>

    <line x1="820" y1="165" x2="1180" y2="165" stroke="#EDE5D5" stroke-width="1" />

    <text x="820" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">把每个 Token 映射成</text>
    <text x="820" y="225" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37"><tspan fill="#E8A87C" font-weight="bold">高维空间里的坐标点</tspan></text>

    <text x="820" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">实际维度：1536维（这里简化为2D）</text>

    <line x1="820" y1="285" x2="1180" y2="285" stroke="#EDE5D5" stroke-width="1" />

    <text x="820" y="315" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37" font-weight="bold">对比学习训练</text>
    <text x="820" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">语义相似的文本对 → <tspan fill="#8FBC8F" font-weight="bold">拉近</tspan></text>
    <text x="820" y="370" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">语义不相似的文本对 → <tspan fill="#D4837F" font-weight="bold">推远</tspan></text>

    <line x1="820" y1="390" x2="1180" y2="390" stroke="#EDE5D5" stroke-width="1" />

    <text x="820" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37" font-weight="bold">外部应用：语义搜索</text>
    <text x="820" y="450" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">文档 → Embedding → 向量 → 存库</text>
    <text x="820" y="475" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">问题 → Embedding → 向量 → 搜索</text>
    <text x="820" y="500" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">靠<tspan fill="#E8A87C" font-weight="bold">向量距离</tspan>找到语义最相关的文档</text>

    <line x1="820" y1="520" x2="1180" y2="520" stroke="#EDE5D5" stroke-width="1" />

    <path fill="#8B6F47" fill-opacity="0.06" d="M828,540 H1192 A8,8 0 0 1 1200,548 V587 A8,8 0 0 1 1192,595 H828 A8,8 0 0 1 820,587 V548 A8,8 0 0 1 828,540 Z" />
    <text x="840" y="565" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" font-weight="bold">记住这个概念</text>
    <text x="840" y="585" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">RAG 就是直接建立在 Embedding 之上</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">23</text>
  </g>
</svg>