    <text x="725" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" font-weight="bold">微调过程</text>

    
    <text x="685" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37" font-weight="bold">训练前（基础模型）</text>
    <path fill="#D4837F" fill-opacity="0.08" d="M693,198 H1187 A8,8 0 0 1 1195,206 V235 A8,8 0 0 1 1187,243 H693 A8,8 0 0 1 685,235 V206 A8,8 0 0 1 693,198 Z" />
    <text x="700" y="215" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">问："项目里 SRE 负责什么？"</text>
    <text x="700" y="236" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#D4837F">答：可能胡编或给出通用回答</text>

    <text x="940" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B7D6B" text-anchor="middle">↓  SFT 训练</text>

    <text x="685" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37" font-weight="bold">训练后（领域专家）</text>
    <path fill="#8FBC8F" fill-opacity="0.08" d="M693,313 H1187 A8,8 0 0 1 1195,321 V350 A8,8 0 0 1 1187,358 H693 A8,8 0 0 1 685,350 V321 A8,8 0 0 1 693,313 Z" />
    <text x="700" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">问："项目里 SRE 负责什么？"</text>
    <text x="700" y="351" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8FBC8F">答：用行业术语精确回答（知识"烧进"权重）</text>

    <line x1="685" y1="380" x2="1195" y2="380" stroke="#EDE5D5" stroke-width="1" />

    <text x="685" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" font-weight="bold">成本：需要 GPU 训练</text>
    <text x="685" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">更新知识 → 重新训练</text>
    <text x="685" y="460" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#D4837F">无法引用来源（知识融合在权重中）</text>
