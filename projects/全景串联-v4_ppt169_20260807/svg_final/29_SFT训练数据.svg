  <rect width="1280" height="720" fill="#F5F0E8" />

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">SFT — 监督微调</text>
    <path fill="#E8A87C" d="M61.50,78 H138.50 A1.50,1.50 0 0 1 140,79.50 V79.50 A1.50,1.50 0 0 1 138.50,81 H61.50 A1.50,1.50 0 0 1 60,79.50 V79.50 A1.50,1.50 0 0 1 61.50,78 Z" />
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">知识"烧进"模型权重</text>
  </g>

  
  <g id="training-data">
    <path fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1" d="M76,105 H604 A16,16 0 0 1 620,121 V469 A16,16 0 0 1 604,485 H76 A16,16 0 0 1 60,469 V121 A16,16 0 0 1 76,105 Z" />
