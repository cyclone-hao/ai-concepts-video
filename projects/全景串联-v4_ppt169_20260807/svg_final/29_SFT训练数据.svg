  </g>
    <text x="125" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" font-weight="bold">训练数据示例（Question-Answer 对）</text>

    
    <path fill="#F0EBE0" d="M93,170 H587 A8,8 0 0 1 595,178 V222 A8,8 0 0 1 587,230 H93 A8,8 0 0 1 85,222 V178 A8,8 0 0 1 93,170 Z" />
    <text x="100" y="195" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" font-weight="bold">Q: 什么是 RAG？</text>
    <text x="100" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">A: RAG 是检索增强生成，让 AI 先查资料再回答...</text>

    
    <path fill="#F0EBE0" d="M93,245 H587 A8,8 0 0 1 595,253 V297 A8,8 0 0 1 587,305 H93 A8,8 0 0 1 85,297 V253 A8,8 0 0 1 93,245 Z" />
    <text x="100" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" font-weight="bold">Q: Fine-tuning 和 RAG 有什么区别？</text>
    <text x="100" y="293" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">A: Fine-tuning 像上课学习，RAG 像开卷考试...</text>

    
    <path fill="#F0EBE0" d="M93,320 H587 A8,8 0 0 1 595,328 V372 A8,8 0 0 1 587,380 H93 A8,8 0 0 1 85,372 V328 A8,8 0 0 1 93,320 Z" />
    <text x="100" y="345" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" font-weight="bold">Q: 什么场景适合 Fine-tuning？</text>
    <text x="100" y="368" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#5D4E37">A: 需要学习行业术语、表达风格或特定任务能力时...</text>

    <text x="340" y="415" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle" font-style="italic">... 数千到数万条高质量 QA 对 ...</text>

    <path fill="#E8A87C" fill-opacity="0.1" d="M91,430 H589 A6,6 0 0 1 595,436 V454 A6,6 0 0 1 589,460 H91 A6,6 0 0 1 85,454 V436 A6,6 0 0 1 91,430 Z" />
    <text x="340" y="451" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B6F47" text-anchor="middle" font-weight="bold">数据质量 &gt; 数据数量</text>
  </g>

  
