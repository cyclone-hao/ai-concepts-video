    <text x="130" y="567" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">SFT 学会行业术语和表达风格 + RAG 提供实时准确的事实信息 = 既懂行又不编造</text>
