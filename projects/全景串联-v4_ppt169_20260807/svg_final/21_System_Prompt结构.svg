    <text x="905" y="348" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" font-weight="bold">技术真相</text>

    <text x="860" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">System Prompt 和 User Prompt</text>
    <text x="860" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37"><tspan fill="#D4837F" font-weight="bold">没有本质区别</tspan></text>
    <text x="860" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">都是 Token，都进入同一个 Context</text>
    <text x="860" y="465" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">role: "system" 只是 API 层面的标记</text>
    <text x="860" y="488" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B">告诉模型"这段话优先级更高"</text>
  </g>

  
  <g id="summary">
    <path fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1" d="M72,530 H1208 A12,12 0 0 1 1220,542 V588 A12,12 0 0 1 1208,600 H72 A12,12 0 0 1 60,588 V542 A12,12 0 0 1 72,530 Z" />
    <text x="640" y="572" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5D4E37" text-anchor="middle" font-weight="bold">System Prompt = 放在最前面的、优先级更高的 Prompt</text>
  </g>

