    <text x="100" y="168" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5D4E37">{</text>
    <text x="120" y="193" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5D4E37">role: <tspan fill="#E8A87C" font-weight="bold">"system"</tspan>,</text>
    <text x="120" y="218" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5D4E37">content: <tspan fill="#8FBC8F">"你是XX公司的智能客服。</tspan></text>
    <text x="140" y="240" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8FBC8F">职责：帮助用户解决订单相关问题。</text>
    <text x="140" y="260" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8FBC8F">规则：1.语气友好 2.不讨论竞品</text>
    <text x="140" y="276" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8FBC8F">3.不确定的转人工 4.回答≤100字"</text>
    <text x="100" y="276" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5D4E37">}</text>
    <text x="110" y="292" font-family="Consolas, Courier New, monospace" font-size="13" fill="#8B7D6B">,</text>

    
    <path fill="#EDE5D5" fill-opacity="0.5" d="M88,295 H752 A8,8 0 0 1 760,303 V337 A8,8 0 0 1 752,345 H88 A8,8 0 0 1 80,337 V303 A8,8 0 0 1 88,295 Z" />
    <text x="100" y="318" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5D4E37">{ role: <tspan fill="#8B6F47">"user"</tspan>,</text>
    <text x="310" y="318" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5D4E37">content: <tspan fill="#8FBC8F">"我的订单怎么还没发货？"</tspan> }</text>

    <text x="90" y="370" font-family="Consolas, Courier New, monospace" font-size="13" fill="#8B7D6B">]</text>
  </g>

  
