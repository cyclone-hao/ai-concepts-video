  <text x="60" y="170" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#8B7D6B" font-weight="bold">基础层</text>
  <text x="60" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#8B7D6B" font-weight="bold">能力层</text>
  <text x="350" y="460" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#8B7D6B" font-weight="bold">系统层</text>

  
  <text x="640" y="640" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle" font-weight="bold">从底层机制到顶层应用，层层递进</text>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">41</text>
