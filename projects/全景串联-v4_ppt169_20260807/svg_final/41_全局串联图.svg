    <path fill="#8B6F47" stroke="#8B6F47" stroke-width="2" d="M492,550 H788 A12,12 0 0 1 800,562 V593 A12,12 0 0 1 788,605 H492 A12,12 0 0 1 480,593 V562 A12,12 0 0 1 492,550 Z" />
    <text x="640" y="578" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#FAF7F2" text-anchor="middle" font-weight="bold">Harness Engineering</text>
    <text x="640" y="596" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#FAF7F2" text-anchor="middle" fill-opacity="0.8">系统工程 · 驾驭 AI 的完整体系</text>
    
    <line x1="540" y1="550" x2="485" y2="510" stroke="#8B6F47" stroke-width="1" stroke-opacity="0.4" />
    <line x1="740" y1="550" x2="745" y2="510" stroke="#8B6F47" stroke-width="1" stroke-opacity="0.4" />
