    <text x="280" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">如果你有很长的背景资料要喂给模型</text>
    <text x="280" y="625" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">把<tspan fill="#E8A87C" font-weight="bold">核心问题或指令</tspan>放在<tspan fill="#E8A87C" font-weight="bold">最前面或最后面</tspan></text>
