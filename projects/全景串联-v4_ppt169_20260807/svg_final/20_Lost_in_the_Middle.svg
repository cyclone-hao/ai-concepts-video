    <path fill="#E8A87C" d="M561.50,78 H718.50 A1.50,1.50 0 0 1 720,79.50 V79.50 A1.50,1.50 0 0 1 718.50,81 H561.50 A1.50,1.50 0 0 1 560,79.50 V79.50 A1.50,1.50 0 0 1 561.50,78 Z" />
