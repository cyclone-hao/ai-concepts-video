<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8" />

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">同样的模型，不同的问法</text>
    <path fill="#E8A87C" d="M61.50,78 H138.50 A1.50,1.50 0 0 1 140,79.50 V79.50 A1.50,1.50 0 0 1 138.50,81 H61.50 A1.50,1.50 0 0 1 60,79.50 V79.50 A1.50,1.50 0 0 1 61.50,78 Z" />
  </g>

  
  <g id="vague-prompt">
    <path fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1" d="M76,110 H594 A16,16 0 0 1 610,126 V434 A16,16 0 0 1 594,450 H76 A16,16 0 0 1 60,434 V126 A16,16 0 0 1 76,110 Z" />
    <text x="90" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B" font-weight="bold">模糊 Prompt</text>

    <path fill="#F0EBE0" d="M100,165 H570 A10,10 0 0 1 580,175 V235 A10,10 0 0 1 570,245 H100 A10,10 0 0 1 90,235 V175 A10,10 0 0 1 100,165 Z" />
    <text x="110" y="195" font-family="Consolas, Courier New, monospace" font-size="16" fill="#5D4E37">"帮我写个排序算法"</text>

    <text x="335" y="290" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="60" fill="#EDE5D5" text-anchor="middle">❓</text>

    <text x="335" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle">冒泡？插入？快速？不确定</text>
    <text x="335" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle">看模型心情</text>

    <path fill="#D4837F" fill-opacity="0.1" d="M174,410 H496 A14,14 0 0 1 510,424 V424 A14,14 0 0 1 496,438 H174 A14,14 0 0 1 160,424 V424 A14,14 0 0 1 174,410 Z" />
    <text x="335" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#D4837F" text-anchor="middle">搜索空间大 → 结果不确定</text>
  </g>

  
  <g id="precise-prompt">
    <path fill="#FAF7F2" stroke="#E8A87C" stroke-width="2" d="M686,110 H1204 A16,16 0 0 1 1220,126 V434 A16,16 0 0 1 1204,450 H686 A16,16 0 0 1 670,434 V126 A16,16 0 0 1 686,110 Z" />
    <text x="700" y="148" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#E8A87C" font-weight="bold">精确 Prompt</text>

    <path fill="#F0EBE0" d="M710,165 H1180 A10,10 0 0 1 1190,175 V275 A10,10 0 0 1 1180,285 H710 A10,10 0 0 1 700,275 V175 A10,10 0 0 1 710,165 Z" />
    <text x="720" y="195" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5D4E37">"用 <tspan fill="#E8A87C" font-weight="bold">Python</tspan> 实现<tspan fill="#E8A87C" font-weight="bold">快速排序</tspan>，</text>
    <text x="720" y="218" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5D4E37">输入是<tspan fill="#E8A87C" font-weight="bold">整数列表</tspan>，</text>
    <text x="720" y="241" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5D4E37">要求<tspan fill="#E8A87C" font-weight="bold">原地排序</tspan>，返回<tspan fill="#E8A87C" font-weight="bold">升序</tspan>结果，</text>
    <text x="720" y="264" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5D4E37">时间复杂度 <tspan fill="#E8A87C" font-weight="bold">O(n log n)</tspan>"</text>

    <text x="945" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="60" fill="#8FBC8F" text-anchor="middle">✓</text>

    <text x="945" y="385" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle" font-weight="bold">结果确定，质量可控</text>

    <path fill="#8FBC8F" fill-opacity="0.15" d="M784,410 H1106 A14,14 0 0 1 1120,424 V424 A14,14 0 0 1 1106,438 H784 A14,14 0 0 1 770,424 V424 A14,14 0 0 1 784,410 Z" />
    <text x="945" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8FBC8F" text-anchor="middle" font-weight="bold">约束条件缩小搜索空间</text>
  </g>

  
  <path fill="#8B6F47" d="M605,240 H675 A20,20 0 0 1 695,260 V260 A20,20 0 0 1 675,280 H605 A20,20 0 0 1 585,260 V260 A20,20 0 0 1 605,240 Z" />
  <text x="640" y="267" font-family="Georgia, serif" font-size="20" fill="#FAF7F2" text-anchor="middle" font-weight="bold">VS</text>

  
  <g id="insight">
    <path fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1" d="M76,480 H1204 A16,16 0 0 1 1220,496 V564 A16,16 0 0 1 1204,580 H76 A16,16 0 0 1 60,564 V496 A16,16 0 0 1 76,480 Z" />
    
  <g transform="translate(90.0, 505.0) scale(1.3333333333333333)" fill="#8B6F47">
    <path d="M4 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M21 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M4.893 4.893a1 1 0 0 1 1.32 -.083l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 0 -1.414z" />
    <path d="M17.693 4.893a1 1 0 0 1 1.497 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7z" />
    <path d="M14 18a1 1 0 0 1 1 1a3 3 0 0 1 -6 0a1 1 0 0 1 .883 -.993l.117 -.007h4z" />
    <path d="M12 6a6 6 0 0 1 3.6 10.8a1 1 0 0 1 -.471 .192l-.129 .008h-6a1 1 0 0 1 -.6 -.2a6 6 0 0 1 3.6 -10.8z" />
  </g>
    <text x="140" y="520" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5D4E37" font-weight="bold">Prompt Engineering（提示词工程）</text>
    <text x="140" y="550" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">研究怎么把需求说得更精确、更结构化</text>
    <text x="140" y="572" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#5D4E37">让模型更容易给出你想要的答案</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">18</text>
  </g>
</svg>