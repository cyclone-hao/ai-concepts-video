<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#F5F0E8" />

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="34" fill="#8B6F47" font-weight="bold">Attention — 注意力机制</text>
    <path fill="#E8A87C" d="M61.50,78 H138.50 A1.50,1.50 0 0 1 140,79.50 V79.50 A1.50,1.50 0 0 1 138.50,81 H61.50 A1.50,1.50 0 0 1 60,79.50 V79.50 A1.50,1.50 0 0 1 61.50,78 Z" />
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="end">同时关注远距离信息</text>
  </g>

  <g id="sentence-area">
    
    <text x="640" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37" text-anchor="middle">小明在</text>

    
    <path fill="#E8A87C" fill-opacity="0.15" d="M484,194 H540 A8,8 0 0 1 548,202 V226 A8,8 0 0 1 540,234 H484 A8,8 0 0 1 476,226 V202 A8,8 0 0 1 484,194 Z" />
    <text x="512" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" text-anchor="middle" font-weight="bold">北京</text>

    <text x="640" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37" text-anchor="middle">
      <tspan>小明在</tspan><tspan fill="#C4956A" font-weight="bold"> 北京 </tspan><tspan fill="#5D4E37">参加了一场关于</tspan></text>

    
    <text x="925" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" font-weight="bold">学术研讨会</text>

    
    <path fill="none" stroke="#E8A87C" stroke-width="2" stroke-dasharray="6,3" d="M1093,194 H1157 A8,8 0 0 1 1165,202 V226 A8,8 0 0 1 1157,234 H1093 A8,8 0 0 1 1085,226 V202 A8,8 0 0 1 1093,194 Z" />
    <text x="1125" y="222" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#E8A87C" text-anchor="middle">___</text>

    <text x="1180" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">的</text>
  </g>

  
  
  <rect x="60" y="170" width="1160" height="80" fill="#F5F0E8" />

  <g id="sentence-clean">
    
    <text x="100" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">小明在</text>

    
    <path fill="#E8A87C" fill-opacity="0.15" d="M223,194 H283 A8,8 0 0 1 291,202 V224 A8,8 0 0 1 283,232 H223 A8,8 0 0 1 215,224 V202 A8,8 0 0 1 223,194 Z" />
    <text x="220" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" font-weight="bold">北京</text>

    <text x="300" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">参加了一场关于</text>

    
    <path fill="none" stroke="#E8A87C" stroke-width="2" stroke-dasharray="6,3" d="M613,194 H677 A8,8 0 0 1 685,202 V224 A8,8 0 0 1 677,232 H613 A8,8 0 0 1 605,224 V202 A8,8 0 0 1 613,194 Z" />
    <text x="645" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#E8A87C" text-anchor="middle">___</text>

    <text x="695" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">的</text>

    
    <path fill="#E8A87C" fill-opacity="0.15" d="M734,194 H878 A8,8 0 0 1 886,202 V224 A8,8 0 0 1 878,232 H734 A8,8 0 0 1 726,224 V202 A8,8 0 0 1 734,194 Z" />
    <text x="732" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#C4956A" font-weight="bold">学术研讨会</text>

    <text x="896" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" fill="#5D4E37">。</text>
  </g>

  <g id="attention-arcs">
    
    <path d="M 253 235 C 253 350 645 350 645 235" fill="none" stroke="#E8A87C" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="420" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#E8A87C" font-weight="bold">Attention</text>

    
    <path d="M 806 235 C 806 310 645 310 645 235" fill="none" stroke="#C4956A" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="710" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#C4956A" font-weight="bold">Attention</text>

    
    <polygon points="645,234 640,244 650,244" fill="#E8A87C" />
  </g>

  <g id="explanation">
    <path fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1" d="M116,390 H1164 A16,16 0 0 1 1180,406 V654 A16,16 0 0 1 1164,670 H116 A16,16 0 0 1 100,654 V406 A16,16 0 0 1 116,390 Z" />

    
  <g transform="translate(130.0, 418.0) scale(1.5)" fill="#8B6F47">
    <path d="M4 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M21 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M4.893 4.893a1 1 0 0 1 1.32 -.083l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 0 -1.414z" />
    <path d="M17.693 4.893a1 1 0 0 1 1.497 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7z" />
    <path d="M14 18a1 1 0 0 1 1 1a3 3 0 0 1 -6 0a1 1 0 0 1 .883 -.993l.117 -.007h4z" />
    <path d="M12 6a6 6 0 0 1 3.6 10.8a1 1 0 0 1 -.471 .192l-.129 .008h-6a1 1 0 0 1 -.6 -.2a6 6 0 0 1 3.6 -10.8z" />
  </g>
    <text x="180" y="443" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" font-weight="bold">Attention 的核心能力</text>

    <text x="130" y="484" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">要填这个空，模型不能只看"关于"后面的内容</text>
    <text x="130" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">它需要<tspan fill="#C4956A" font-weight="bold">同时关注</tspan>到<tspan fill="#C4956A" font-weight="bold">"北京"</tspan>和<tspan fill="#C4956A" font-weight="bold">"学术研讨会"</tspan>这两个关键信息</text>
    <text x="130" y="536" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37">把它们<tspan fill="#E8A87C" font-weight="bold">综合起来</tspan>判断空白处应该填什么</text>

    
    <line x1="130" y1="558" x2="1140" y2="558" stroke="#EDE5D5" stroke-width="1" />

    
    
  <g transform="translate(130.0, 570.0) scale(0.9166666666666666)" fill="#C4956A">
    <path d="M12.085 6.5l5.415 5.415l-8.793 8.792a1 1 0 0 1 -.707 .293h-4a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 .293 -.707zm5.406 -2.698a3.828 3.828 0 0 1 1.716 6.405l-.292 .293l-5.415 -5.415l.293 -.292a3.83 3.83 0 0 1 3.698 -.991" />
  </g>
    <text x="160" y="587" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#C4956A" font-weight="bold">原理简述</text>

    <text x="130" y="614" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">模型给每个词生成三个向量：<tspan fill="#C4956A" font-weight="bold">Q</tspan>（查询 = 我在找什么）、<tspan fill="#C4956A" font-weight="bold">K</tspan>（键 = 我有什么）、<tspan fill="#C4956A" font-weight="bold">V</tspan>（值 = 我的具体内容）。</text>
    <text x="130" y="636" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">分数怎么来？用当前词的 Q 和每个词的 K <tspan fill="#C4956A" font-weight="bold">做点积</tspan>——向量越相似，说明这个词越相关，分数越高。</text>
    <text x="130" y="658" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">分数高的词，它的 V 在<tspan fill="#E8A87C" font-weight="bold">加权求和</tspan>中占比更大——比如"北京"和"研讨会"的 V 被重点采用，填出了正确答案。</text>
  </g>

  
  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">6</text>
  </g>
</svg>