<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="secGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6F47"/>
      <stop offset="100%" stop-color="#6B5535"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#secGrad1)"/>

  <!-- Decorative circles -->
  <g id="decoration">
    <circle cx="1050" cy="580" r="200" fill="#FAF7F2" fill-opacity="0.05"/>
    <circle cx="200" cy="140" r="120" fill="#FAF7F2" fill-opacity="0.04"/>
  </g>

  <g id="content">
    <!-- Large section number -->
    <text x="640" y="260" font-family="Georgia, Microsoft YaHei, serif" font-size="120" fill="#FAF7F2" fill-opacity="0.15" text-anchor="middle" font-weight="bold">01</text>

    <!-- Title -->
    <text x="640" y="340" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="52" fill="#FAF7F2" text-anchor="middle" font-weight="bold">LLM — 大语言模型</text>
    <rect x="520" y="365" width="240" height="4" rx="2" fill="#E8A87C"/>

    <!-- Core definition -->
    <text x="640" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#FAF7F2" fill-opacity="0.8" text-anchor="middle">给一段文字，预测下一个最可能出现的词</text>

    <!-- Icon -->
    <use data-icon="tabler-filled/bulb" x="610" y="465" width="36" height="36" fill="#E8A87C" fill-opacity="0.6"/>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="40" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FAF7F2" fill-opacity="0.5">AI大家学 · 大模型技术篇</text>
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FAF7F2" fill-opacity="0.5" text-anchor="end">4</text>
  </g>
</svg>
