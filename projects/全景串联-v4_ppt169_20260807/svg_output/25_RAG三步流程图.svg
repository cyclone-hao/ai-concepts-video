<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowRag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B6F47"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">RAG 三步流程</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">检索增强生成</text>
  </g>

  <!-- Step 1: 建库 -->
  <g id="step-1">
    <rect x="60" y="110" width="340" height="400" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <rect x="60" y="110" width="340" height="6" rx="3" fill="#8B6F47"/>

    <rect x="90" y="135" width="50" height="50" rx="25" fill="#8B6F47"/>
    <text x="115" y="168" font-family="Georgia, serif" font-size="22" fill="#FAF7F2" text-anchor="middle" font-weight="bold">1</text>

    <text x="155" y="165" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" font-weight="bold">建库</text>

    <!-- Sub-steps -->
    <g id="step1-flow">
      <use data-icon="tabler-filled/file-text" x="100" y="200" width="28" height="28" fill="#8B6F47"/>
      <text x="140" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">文档集合</text>

      <text x="235" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">→</text>

      <text x="260" y="220" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">✂️ 切片</text>

      <text x="125" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <text x="100" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">🔢 Embedding 向量化</text>

      <text x="125" y="340" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <use data-icon="tabler-filled/database" x="100" y="355" width="28" height="28" fill="#8B6F47"/>
      <text x="140" y="375" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" font-weight="bold">向量数据库</text>
      <text x="140" y="395" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">Pinecone / Milvus / Chroma</text>

      <text x="100" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">存的是向量，靠距离搜索</text>
      <text x="100" y="450" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">（不是关键词匹配）</text>
    </g>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="410" y1="310" x2="440" y2="310" stroke="#8B6F47" stroke-width="2.5" marker-end="url(#arrowRag)"/>

  <!-- Step 2: 检索 -->
  <g id="step-2">
    <rect x="450" y="110" width="340" height="400" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <rect x="450" y="110" width="340" height="6" rx="3" fill="#E8A87C"/>

    <rect x="480" y="135" width="50" height="50" rx="25" fill="#E8A87C"/>
    <text x="505" y="168" font-family="Georgia, serif" font-size="22" fill="#FAF7F2" text-anchor="middle" font-weight="bold">2</text>

    <text x="545" y="165" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#E8A87C" font-weight="bold">检索</text>

    <g id="step2-flow">
      <text x="490" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">❓ 用户问题</text>

      <text x="525" y="245" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <text x="490" y="280" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">🔢 问题 → 向量</text>

      <text x="525" y="315" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <use data-icon="tabler-filled/search" x="490" y="330" width="28" height="28" fill="#E8A87C"/>
      <text x="530" y="350" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">语义搜索</text>
      <text x="530" y="370" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">在向量数据库中找最近的</text>

      <text x="525" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <text x="490" y="435" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" font-weight="bold">📑 Top-K 相关文档</text>
      <text x="490" y="460" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">取最相关的 K 段文档</text>
    </g>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="800" y1="310" x2="830" y2="310" stroke="#8B6F47" stroke-width="2.5" marker-end="url(#arrowRag)"/>

  <!-- Step 3: 生成 -->
  <g id="step-3">
    <rect x="840" y="110" width="380" height="400" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <rect x="840" y="110" width="380" height="6" rx="3" fill="#8FBC8F"/>

    <rect x="870" y="135" width="50" height="50" rx="25" fill="#8FBC8F"/>
    <text x="895" y="168" font-family="Georgia, serif" font-size="22" fill="#FAF7F2" text-anchor="middle" font-weight="bold">3</text>

    <text x="935" y="165" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" font-weight="bold">生成</text>

    <g id="step3-flow">
      <text x="880" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">📑 Top-K 文档</text>
      <text x="880" y="232" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">+ ❓ 用户问题</text>

      <text x="915" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <text x="880" y="295" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">塞入 Context Window</text>

      <text x="915" y="325" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <use data-icon="tabler-filled/bulb" x="880" y="340" width="28" height="28" fill="#8B6F47"/>
      <text x="920" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37">LLM 基于参考资料回答</text>

      <text x="915" y="395" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B7D6B">↓</text>

      <rect x="870" y="410" width="320" height="45" rx="8" fill="#8FBC8F" fill-opacity="0.15" stroke="#8FBC8F" stroke-width="1"/>
      <text x="1030" y="440" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" text-anchor="middle" font-weight="bold">💬 有据可查的回答</text>

      <text x="880" y="480" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B">不是凭空编造，基于真实文档</text>
    </g>
  </g>

  <!-- Bottom summary -->
  <g id="summary">
    <rect x="60" y="540" width="1160" height="70" rx="12" fill="#8B6F47" fill-opacity="0.06" stroke="#8B6F47" stroke-width="1"/>
    <text x="640" y="572" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8B6F47" text-anchor="middle" font-weight="bold">RAG = 搜索引擎 + 大模型</text>
    <text x="640" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle">搜索引擎负责找到相关资料，大模型负责把资料"翻译"成人话回答你</text>
  </g>

  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">25</text>
  </g>
</svg>
