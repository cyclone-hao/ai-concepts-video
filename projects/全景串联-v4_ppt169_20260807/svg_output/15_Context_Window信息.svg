<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <g id="header">
    <text x="60" y="65" font-family="Microsoft YaHei, PingFang SC, Georgia, serif" font-size="30" fill="#8B6F47" font-weight="bold">Context Window — 上下文窗口</text>
    <rect x="60" y="78" width="80" height="3" rx="1.5" fill="#E8A87C"/>
    <text x="1220" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="end">模型一次能"读"的最大 Token 数</text>
  </g>

  <!-- Four model cards -->
  <g id="model-cards">
    <!-- GPT-5.6 -->
    <g id="card-gpt">
      <rect x="60" y="120" width="270" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <rect x="60" y="120" width="270" height="6" rx="3" fill="#8B6F47"/>
      <text x="195" y="170" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8B6F47" text-anchor="middle" font-weight="bold">GPT-5.6</text>
      <text x="195" y="240" font-family="Georgia, serif" font-size="42" fill="#8B6F47" text-anchor="middle" font-weight="bold">105万</text>
      <text x="195" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle">Token</text>
      <line x1="100" y1="290" x2="290" y2="290" stroke="#EDE5D5" stroke-width="1"/>
      <text x="195" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">≈ 三四本书的内容</text>
      <use data-icon="tabler-filled/bolt" x="175" y="340" width="28" height="28" fill="#E8A87C"/>
    </g>

    <!-- Claude Opus 5 -->
    <g id="card-claude">
      <rect x="360" y="120" width="270" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <rect x="360" y="120" width="270" height="6" rx="3" fill="#C4956A"/>
      <text x="495" y="170" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#C4956A" text-anchor="middle" font-weight="bold">Claude Opus 5</text>
      <text x="495" y="240" font-family="Georgia, serif" font-size="42" fill="#C4956A" text-anchor="middle" font-weight="bold">100万</text>
      <text x="495" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle">Token</text>
      <line x1="400" y1="290" x2="590" y2="290" stroke="#EDE5D5" stroke-width="1"/>
      <text x="495" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">≈ 三四本书的内容</text>
      <use data-icon="tabler-filled/bulb" x="475" y="340" width="28" height="28" fill="#E8A87C"/>
    </g>

    <!-- Gemini -->
    <g id="card-gemini">
      <rect x="660" y="120" width="270" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <rect x="660" y="120" width="270" height="6" rx="3" fill="#E8A87C"/>
      <text x="795" y="170" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#E8A87C" text-anchor="middle" font-weight="bold">Gemini</text>
      <text x="795" y="240" font-family="Georgia, serif" font-size="42" fill="#E8A87C" text-anchor="middle" font-weight="bold">100万+</text>
      <text x="795" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle">Token</text>
      <line x1="700" y1="290" x2="890" y2="290" stroke="#EDE5D5" stroke-width="1"/>
      <text x="795" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">百万级上下文</text>
      <use data-icon="tabler-filled/world" x="775" y="340" width="28" height="28" fill="#E8A87C"/>
    </g>

    <!-- DeepSeek-V3 / Kimi K3 -->
    <g id="card-domestic">
      <rect x="960" y="120" width="270" height="280" rx="16" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <rect x="960" y="120" width="270" height="6" rx="3" fill="#8FBC8F"/>
      <text x="1095" y="165" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8B6F47" text-anchor="middle" font-weight="bold">DeepSeek-V3</text>
      <text x="1095" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B" text-anchor="middle">/ Kimi K3</text>
      <text x="1095" y="245" font-family="Georgia, serif" font-size="42" fill="#8B6F47" text-anchor="middle" font-weight="bold">128K</text>
      <text x="1095" y="275" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle">Token</text>
      <line x1="1000" y1="295" x2="1190" y2="295" stroke="#EDE5D5" stroke-width="1"/>
      <text x="1095" y="325" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">≈ 10万汉字</text>
      <use data-icon="tabler-filled/database" x="1075" y="340" width="28" height="28" fill="#8FBC8F"/>
    </g>
  </g>

  <!-- Warning -->
  <g id="warning">
    <rect x="60" y="440" width="1160" height="80" rx="12" fill="#D4837F" fill-opacity="0.08" stroke="#D4837F" stroke-width="1"/>
    <use data-icon="tabler-filled/alert-triangle" x="90" y="458" width="28" height="28" fill="#D4837F"/>
    <text x="130" y="476" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5D4E37" font-weight="bold">窗口大 ≠ 每个位置都能完美关注</text>
    <text x="130" y="502" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8B7D6B">模型对不同位置的注意力是不均匀的 — 后面讲 Prompt 时会给出实用技巧</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="end">15</text>
  </g>
</svg>
