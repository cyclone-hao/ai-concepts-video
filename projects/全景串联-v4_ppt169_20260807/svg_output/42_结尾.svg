    <rect x="480" y="510" width="110" height="32" rx="16" fill="#FAF7F2" fill-opacity="0.12"/>
    <text x="535" y="531" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FAF7F2" text-anchor="middle">⭐ 收藏</text>

    <rect x="620" y="510" width="110" height="32" rx="16" fill="#FAF7F2" fill-opacity="0.12"/>
    <text x="675" y="531" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FAF7F2" text-anchor="middle">🔄 转发</text>

    <rect x="760" y="510" width="110" height="32" rx="16" fill="#FAF7F2" fill-opacity="0.12"/>
    <text x="815" y="531" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#FAF7F2" text-anchor="middle">💬 评论</text>
