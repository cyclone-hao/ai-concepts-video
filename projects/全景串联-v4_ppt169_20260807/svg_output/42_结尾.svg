  <g id="footer">
    <text x="40" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FAF7F2" fill-opacity="0.5">AI大家学 · 大模型技术篇</text>
    <text x="1240" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#FAF7F2" fill-opacity="0.5" text-anchor="end">42</text>
