<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="closingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6F47" />
      <stop offset="100%" stop-color="#E8A87C" />
    </linearGradient>
  </defs>

  <g id="bg-layer">
    <rect width="1280" height="720" fill="#F5F0E8" />
  </g>

  <g id="decoration-line">
    <line x1="540" y1="80" x2="740" y2="80" stroke="#E8A87C" stroke-width="2" />
  </g>

  <g id="closing-quote">
    <text x="640" y="160" font-family="KaiTi, Georgia, serif" font-size="28" fill="#8B6F47" text-anchor="middle">K3 的真正意义</text>
    <text x="640" y="210" font-family="KaiTi, Georgia, serif" font-size="20" fill="#5D4E37" text-anchor="middle" font-style="italic">不在于它是不是全球第一</text>
    <text x="640" y="250" font-family="KaiTi, Georgia, serif" font-size="20" fill="#5D4E37" text-anchor="middle" font-style="italic">而在于它证明了——</text>
  </g>

  <g id="core-message">
    <text x="640" y="310" font-family="KaiTi, Georgia, serif" font-size="24" font-weight="bold" fill="#E8A87C" text-anchor="middle">顶级AI不再是美国巨头的专利</text>
    <text x="640" y="350" font-family="KaiTi, Georgia, serif" font-size="24" font-weight="bold" fill="#E8A87C" text-anchor="middle">来自中国的团队同样可以创造出世界级的模型</text>
    <text x="640" y="390" font-family="KaiTi, Georgia, serif" font-size="24" font-weight="bold" fill="#E8A87C" text-anchor="middle">并且开源给全世界使用</text>
  </g>

  <g id="decoration-line-2">
    <line x1="440" y1="430" x2="840" y2="430" stroke="#EDE5D5" stroke-width="1" />
  </g>

  <g id="future-look">
    <text x="640" y="470" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8B7D6B" text-anchor="middle">AI竞赛的未来，不再是"美国 vs 世界"</text>
    <text x="640" y="500" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8B7D6B" text-anchor="middle">而是"开放 vs 封闭"的路线之争</text>
  </g>

  <g id="cta-block">
    <path fill="#FAF7F2" stroke="url(#closingGrad)" stroke-width="2" d="M356,540 H924 A16,16 0 0 1 940,556 V644 A16,16 0 0 1 924,660 H356 A16,16 0 0 1 340,644 V556 A16,16 0 0 1 356,540 Z" />
    <text x="640" y="580" font-family="KaiTi, Georgia, serif" font-size="20" font-weight="bold" fill="#8B6F47" text-anchor="middle">关注我们 · 持续追踪AI前沿</text>
    <text x="640" y="615" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#5D4E37" text-anchor="middle">B站：AI大家学  ·  抖音：AI大家学</text>
    <text x="640" y="645" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#A89B8A" text-anchor="middle">用最通俗的方式，讲最前沿的AI</text>
  </g>

  <g id="page-number">
    <text x="1220" y="695" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#A89B8A" text-anchor="end">14 / 14</text>
  </g>
</svg>