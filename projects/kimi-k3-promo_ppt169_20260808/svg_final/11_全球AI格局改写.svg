    <text x="532" y="178" font-family="KaiTi, Georgia, serif" font-size="20" font-weight="bold" fill="#E8A87C">开源生态的范式转移</text>
    <text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="500" y="225">以往开源模型 = 美国公司</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="500" y="251">的"施舍"</text><line x1="500" y1="290" x2="760" y2="290" stroke="#EDE5D5" stroke-width="1" />
    <text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="500" y="320" font-weight="bold">K3 证明：中国团队</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="500" y="346">可以从零做出</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="500" y="372">世界级的开源模型</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="500" y="398" font-weight="bold">并免费分享给全世界</text><path fill="#E8A87C" fill-opacity="0.10" d="M488,430 H792 A8,8 0 0 1 800,438 V462 A8,8 0 0 1 792,470 H488 A8,8 0 0 1 480,462 V438 A8,8 0 0 1 488,430 Z" />
    <text x="640" y="456" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">全球开发者社区争相微调和部署</text>
  </g>

