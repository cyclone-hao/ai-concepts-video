    <text x="78" y="72" font-family="KaiTi, Georgia, serif" font-size="32" font-weight="bold" fill="#8B6F47">全球AI格局改写</text>
    <text x="440" y="72" font-family="KaiTi, Georgia, serif" font-size="24" fill="#E8A87C">不靠美国也能做到顶级</text>
    <text x="78" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#8B7D6B">K3 开源对全球AI生态的三重冲击</text>
  </g>

