    <text x="132" y="178" font-family="KaiTi, Georgia, serif" font-size="20" font-weight="bold" fill="#8B6F47">主权AI不再依赖美国</text>
    <text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="100" y="225">过去各国想要部署顶级AI</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="100" y="251">必须依赖美国的云服务</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="100" y="277">和模型API</text><line x1="100" y1="310" x2="360" y2="310" stroke="#EDE5D5" stroke-width="1" />
    <text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="100" y="340" font-weight="bold">K3 开源 + 可本地部署</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="100" y="366">= 任何国家都能拥有</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#C75C3A" font-size="15" x="100" y="392">自己的顶级AI</text><path fill="#8B6F47" fill-opacity="0.06" d="M88,430 H392 A8,8 0 0 1 400,438 V462 A8,8 0 0 1 392,470 H88 A8,8 0 0 1 80,462 V438 A8,8 0 0 1 88,430 Z" />
    <text x="240" y="456" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#8B7D6B" text-anchor="middle">欧洲、中东、东南亚已开始部署</text>
  </g>

