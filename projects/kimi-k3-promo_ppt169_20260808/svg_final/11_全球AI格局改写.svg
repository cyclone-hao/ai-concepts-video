    <text x="932" y="178" font-family="KaiTi, Georgia, serif" font-size="20" font-weight="bold" fill="#C75C3A">倒逼美国巨头加速</text>
    <text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="900" y="225">OpenAI、Google、Meta</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="900" y="251">被迫加快开源节奏</text><line x1="900" y1="290" x2="1160" y2="290" stroke="#EDE5D5" stroke-width="1" />
    <text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="900" y="320">AI不再是美国独大的游戏</text><text font-family="'Microsoft YaHei', Arial, sans-serif" fill="#5D4E37" font-size="15" x="900" y="346">而是全球多极竞争</text><path fill="#C75C3A" fill-opacity="0.06" d="M888,380 H1192 A8,8 0 0 1 1200,388 V462 A8,8 0 0 1 1192,470 H888 A8,8 0 0 1 880,462 V388 A8,8 0 0 1 888,380 Z" />
    <text x="1040" y="415" font-family="KaiTi, Georgia, serif" font-size="16" font-weight="bold" fill="#C75C3A" text-anchor="middle">"AI竞赛的核心</text>
    <text x="1040" y="445" font-family="KaiTi, Georgia, serif" font-size="16" font-weight="bold" fill="#C75C3A" text-anchor="middle">不再是谁有最强的闭源模型</text>
    <text x="1040" y="475" font-family="KaiTi, Georgia, serif" font-size="14" fill="#8B7D6B" text-anchor="middle">而是谁能让更多人用上AI"</text>
  </g>

