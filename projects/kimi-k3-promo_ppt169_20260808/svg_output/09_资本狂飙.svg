<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="trackGradK3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </linearGradient>
  </defs>

  <g id="bg-layer">
    <rect width="1280" height="720" fill="#F5F0E8"/>
  </g>

  <g id="page-header">
    <rect x="60" y="48" width="4" height="44" rx="2" fill="#E8A87C"/>
    <text x="78" y="72" font-family="KaiTi, Georgia, serif" font-size="32" font-weight="bold" fill="#8B6F47">从30亿到500亿</text>
    <text x="420" y="72" font-family="KaiTi, Georgia, serif" font-size="24" fill="#E8A87C">8个月翻10倍+</text>
    <text x="78" y="100" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#8B7D6B">月之暗面估值飙升时间线（亿美元）</text>
  </g>

  <g id="chartArea">
    <g id="timeline-track">
      <line x1="120" y1="400" x2="1160" y2="400" stroke="#EDE5D5" stroke-width="8" stroke-linecap="round"/>
      <line x1="120" y1="400" x2="950" y2="400" stroke="url(#trackGradK3)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <g id="node-1">
      <line x1="160" y1="340" x2="160" y2="380" stroke="#C9A96E" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="160" cy="400" r="20" fill="#C9A96E" fill-opacity="0.15"/>
      <circle cx="160" cy="400" r="12" fill="#C9A96E"/>
    </g>
    <g id="node-1-card">
      <rect x="80" y="180" width="160" height="155" rx="10" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <rect x="80" y="180" width="160" height="36" rx="10" fill="#C9A96E"/>
      <rect x="80" y="204" width="160" height="12" fill="#C9A96E"/>
      <text x="160" y="204" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FAF7F2" text-anchor="middle">2024年8月</text>
      <text x="160" y="250" font-family="KaiTi, Georgia, serif" font-size="28" font-weight="bold" fill="#8B6F47" text-anchor="middle">~30</text>
      <text x="160" y="272" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">亿美元</text>
      <text x="160" y="300" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#A89B8A" text-anchor="middle">K3发布前</text>
    </g>

    <g id="node-2">
      <line x1="380" y1="420" x2="380" y2="460" stroke="#C9A96E" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="380" cy="400" r="20" fill="#C9A96E" fill-opacity="0.15"/>
      <circle cx="380" cy="400" r="12" fill="#C9A96E"/>
    </g>
    <g id="node-2-card">
      <rect x="300" y="465" width="160" height="135" rx="10" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <text x="380" y="500" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B6F47" text-anchor="middle">2026年1月</text>
      <text x="380" y="540" font-family="KaiTi, Georgia, serif" font-size="28" font-weight="bold" fill="#8B6F47" text-anchor="middle">48</text>
      <text x="380" y="562" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">亿美元</text>
      <text x="380" y="585" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#A89B8A" text-anchor="middle">稳步增长</text>
    </g>

    <g id="node-3">
      <line x1="620" y1="340" x2="620" y2="380" stroke="#E8A87C" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="620" cy="400" r="20" fill="#E8A87C" fill-opacity="0.15"/>
      <circle cx="620" cy="400" r="12" fill="#E8A87C"/>
    </g>
    <g id="node-3-card">
      <rect x="530" y="180" width="180" height="155" rx="10" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
      <rect x="530" y="180" width="180" height="36" rx="10" fill="#E8A87C"/>
      <rect x="530" y="204" width="180" height="12" fill="#E8A87C"/>
      <text x="620" y="204" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FAF7F2" text-anchor="middle">2026上半年</text>
      <text x="620" y="250" font-family="KaiTi, Georgia, serif" font-size="24" font-weight="bold" fill="#E8A87C" text-anchor="middle">200→350</text>
      <text x="620" y="272" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">亿美元</text>
      <text x="620" y="300" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#A89B8A" text-anchor="middle">连续四轮融资</text>
      <text x="620" y="318" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" font-weight="bold" fill="#C75C3A" text-anchor="middle">半年涨7倍</text>
    </g>

    <g id="node-4">
      <line x1="840" y1="420" x2="840" y2="460" stroke="#E8A87C" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="840" cy="400" r="26" fill="#E8A87C" fill-opacity="0.20"/>
      <circle cx="840" cy="400" r="16" fill="#E8A87C"/>
      <text x="840" y="407" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" font-weight="bold" fill="#FAF7F2" text-anchor="middle">F</text>
    </g>
    <g id="node-4-card">
      <rect x="750" y="465" width="180" height="135" rx="10" fill="#FAF7F2" stroke="#E8A87C" stroke-width="1.5"/>
      <text x="840" y="500" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#E8A87C" text-anchor="middle">2026年7月 F轮</text>
      <text x="840" y="540" font-family="KaiTi, Georgia, serif" font-size="32" font-weight="bold" fill="#E8A87C" text-anchor="middle">350</text>
      <text x="840" y="562" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">亿美元估值</text>
      <text x="840" y="585" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#A89B8A" text-anchor="middle">融资35亿 · 超募3倍</text>
    </g>

    <g id="node-5-future">
      <line x1="1060" y1="340" x2="1060" y2="380" stroke="#8B7D6B" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="1060" cy="400" r="22" fill="#FFFFFF" stroke="#8B7D6B" stroke-width="2.5"/>
      <text x="1060" y="407" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" font-weight="bold" fill="#8B7D6B" text-anchor="middle">IPO</text>
    </g>
    <g id="node-5-card">
      <rect x="970" y="180" width="180" height="155" rx="10" fill="#FFFFFF" stroke="#8B7D6B" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="1060" y="215" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#8B7D6B" text-anchor="middle">Pre-IPO / IPO</text>
      <text x="1060" y="260" font-family="KaiTi, Georgia, serif" font-size="32" font-weight="bold" fill="#8B6F47" text-anchor="middle">500</text>
      <text x="1060" y="282" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#8B7D6B" text-anchor="middle">亿美元目标估值</text>
      <text x="1060" y="308" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#A89B8A" text-anchor="middle">中金+高盛承销</text>
      <text x="1060" y="325" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#A89B8A" text-anchor="middle">拟募资30亿美元</text>
    </g>
  </g>

  <g id="page-number">
    <text x="1220" y="695" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#A89B8A" text-anchor="end">09 / 14</text>
  </g>
</svg>