<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg-layer">
    <rect width="1280" height="720" fill="#F5F0E8"/>
  </g>

  <g id="page-header">
    <use data-icon="tabler-filled/coin-yuan" x="490" y="60" width="40" height="40" fill="#E8A87C"/>
    <text x="640" y="140" font-family="KaiTi, Georgia, serif" font-size="36" font-weight="bold" fill="#8B6F47" text-anchor="middle">IPO 箭在弦上</text>
    <text x="640" y="175" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8B7D6B" text-anchor="middle">月之暗面即将成为中国首批AI上市独角兽之一</text>
  </g>

  <g id="ipo-card">
    <rect x="340" y="220" width="600" height="180" rx="16" fill="#FAF7F2" stroke="#E8A87C" stroke-width="2"/>
    <text x="640" y="265" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#E8A87C" text-anchor="middle">香港 IPO · 预计年底前登陆港股</text>
    <text x="640" y="330" font-family="KaiTi, Georgia, serif" font-size="52" font-weight="bold" fill="#8B6F47" text-anchor="middle">~30亿美元</text>
    <text x="640" y="370" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#8B7D6B" text-anchor="middle">目标募资金额 · 高盛、中金公司承销</text>
  </g>

  <g id="kpi-1">
    <rect x="100" y="450" width="260" height="140" rx="12" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <use data-icon="tabler-filled/arrow-up-circle" x="120" y="470" width="28" height="28" fill="#6B8E5A"/>
    <text x="160" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#8B7D6B">年化经常性收入</text>
    <text x="230" y="545" font-family="KaiTi, Georgia, serif" font-size="40" font-weight="bold" fill="#6B8E5A" text-anchor="middle">&gt;3亿</text>
    <text x="230" y="575" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#A89B8A" text-anchor="middle">ARR · 美元</text>
  </g>

  <g id="kpi-2">
    <rect x="400" y="450" width="260" height="140" rx="12" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <use data-icon="tabler-filled/flame" x="420" y="470" width="28" height="28" fill="#E8A87C"/>
    <text x="460" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#8B7D6B">Kimi AI 用户</text>
    <text x="530" y="545" font-family="KaiTi, Georgia, serif" font-size="40" font-weight="bold" fill="#E8A87C" text-anchor="middle">4000万</text>
    <text x="530" y="575" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#A89B8A" text-anchor="middle">月活 · 中国第一</text>
  </g>

  <g id="kpi-3">
    <rect x="700" y="450" width="260" height="140" rx="12" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <use data-icon="tabler-filled/cash-banknote" x="720" y="470" width="28" height="28" fill="#8B6F47"/>
    <text x="760" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#8B7D6B">收入增速</text>
    <text x="830" y="545" font-family="KaiTi, Georgia, serif" font-size="40" font-weight="bold" fill="#8B6F47" text-anchor="middle">10倍</text>
    <text x="830" y="575" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#A89B8A" text-anchor="middle">年度同比增长</text>
  </g>

  <g id="kpi-4">
    <rect x="1000" y="450" width="220" height="140" rx="12" fill="#FAF7F2" stroke="#EDE5D5" stroke-width="1"/>
    <use data-icon="tabler-filled/shield" x="1020" y="470" width="28" height="28" fill="#8B6F47"/>
    <text x="1060" y="492" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#8B7D6B">护城河</text>
    <text x="1110" y="540" font-family="KaiTi, Georgia, serif" font-size="20" font-weight="bold" fill="#5D4E37" text-anchor="middle">自研Kimi K3</text>
    <text x="1110" y="570" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#A89B8A" text-anchor="middle">不依赖第三方模型</text>
  </g>

  <g id="context-note">
    <text x="640" y="650" font-family="KaiTi, Georgia, serif" font-size="16" fill="#8B6F47" text-anchor="middle" font-style="italic">若成功上市，将成为中国AI浪潮的标杆性事件。</text>
  </g>

  <g id="page-number">
    <text x="1220" y="695" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#A89B8A" text-anchor="end">10 / 14</text>
  </g>
</svg>