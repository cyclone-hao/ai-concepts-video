      <line x1="856" y1="130" x2="856" y2="640" stroke="#EDE5D5" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="1028" y1="130" x2="1028" y2="640" stroke="#EDE5D5" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="1200" y1="130" x2="1200" y2="640" stroke="#EDE5D5" stroke-width="1" stroke-dasharray="4,4"/>
