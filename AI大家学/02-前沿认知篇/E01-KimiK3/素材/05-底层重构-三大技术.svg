<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1025"/>
    </linearGradient>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#3b82f6"/>
    </marker>
  </defs>
  <style>
    text { font-family: "SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes slideDown { from { opacity:0; transform:translateY(-15px); } to { opacity:1; transform:translateY(0); } }
    .title { font-size:16px; font-weight:700; fill:#e2e8f0; }
    .body { font-size:12px; fill:#cbd5e1; }
    .label { font-size:11px; fill:#94a3b8; }
    .small { font-size:10px; fill:#64748b; }
    .card { fill:#1e293b; stroke:#334155; stroke-width:1.5; rx:8; }
    .head { font-size:13px; font-weight:600; }
    .highlight { font-size:12px; font-weight:600; }
    .g1 { animation: fadeUp 0.5s ease-out 0.2s both; }
    .g2 { animation: slideDown 0.5s ease-out 0.5s both; }
    .g3 { animation: slideDown 0.5s ease-out 0.7s both; }
    .g4 { animation: slideDown 0.5s ease-out 0.9s both; }
    .g5 { animation: fadeIn 0.6s ease-out 1.2s both; }
    .g6 { animation: fadeUp 0.5s ease-out 1.5s both; }
  </style>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <g class="g1">
    <text x="480" y="38" text-anchor="middle" class="title">K3 的底层重构</text>
    <text x="480" y="58" text-anchor="middle" class="label">不是堆参数，是改地基 — 对沿用近十年的基础机制做系统性重写</text>
  </g>

  <!-- Three technology pillars -->
  <!-- Pillar 1: KDA -->
  <g class="g2">
    <rect x="40" y="85" width="280" height="210" class="card"/>
    <rect x="40" y="85" width="280" height="32" rx="8" fill="#4ECDC4" opacity="0.12"/>
    <rect x="40" y="85" width="280" height="32" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="107" text-anchor="middle" class="head" fill="#4ECDC4">KDA 混合线性注意力</text>
    <text x="180" y="140" text-anchor="middle" class="body">不同通道 × 不同衰减速率</text>
    <text x="180" y="160" text-anchor="middle" class="body">管理长序列记忆</text>
    <line x1="70" y1="178" x2="290" y2="178" stroke="#334155" stroke-width="1"/>
    <text x="180" y="200" text-anchor="middle" class="label">+ Attention Residuals</text>
    <text x="180" y="220" text-anchor="middle" class="label">优化层间信息传递</text>
    <line x1="70" y1="238" x2="290" y2="238" stroke="#334155" stroke-width="1"/>
    <text x="180" y="268" text-anchor="middle" class="highlight" fill="#4ECDC4">推理效率 ↑ ~25%</text>
  </g>

  <!-- Pillar 2: Linear Tension -->
  <g class="g3">
    <rect x="340" y="85" width="280" height="210" class="card"/>
    <rect x="340" y="85" width="280" height="32" rx="8" fill="#E8A87C" opacity="0.12"/>
    <rect x="340" y="85" width="280" height="32" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="107" text-anchor="middle" class="head" fill="#E8A87C">Kimi Linear Tension</text>
    <text x="480" y="140" text-anchor="middle" class="body">自研线性注意力机制</text>
    <text x="480" y="160" text-anchor="middle" class="body">解决超长任务性能衰减</text>
    <line x1="370" y1="178" x2="590" y2="178" stroke="#334155" stroke-width="1"/>
    <text x="480" y="205" text-anchor="middle" class="label">上下文窗口 ×10</text>
    <text x="480" y="225" text-anchor="middle" class="label">训练成本仅同步 ×10</text>
    <line x1="370" y1="238" x2="590" y2="238" stroke="#334155" stroke-width="1"/>
    <text x="480" y="268" text-anchor="middle" class="highlight" fill="#E8A87C">长上下文的工程底气</text>
  </g>

  <!-- Pillar 3: Moon Clip -->
  <g class="g4">
    <rect x="640" y="85" width="280" height="210" class="card"/>
    <rect x="640" y="85" width="280" height="32" rx="8" fill="#8b5cf6" opacity="0.12"/>
    <rect x="640" y="85" width="280" height="32" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="780" y="107" text-anchor="middle" class="head" fill="#8b5cf6">Moon Clip 二阶优化器</text>
    <text x="780" y="140" text-anchor="middle" class="body">首次用于大模型训练</text>
    <text x="780" y="160" text-anchor="middle" class="body">提升数据利用效率</text>
    <line x1="670" y1="178" x2="890" y2="178" stroke="#334155" stroke-width="1"/>
    <text x="780" y="205" text-anchor="middle" class="label">20T 数据跑出 40T 效果</text>
    <line x1="670" y1="238" x2="890" y2="238" stroke="#334155" stroke-width="1"/>
    <text x="780" y="268" text-anchor="middle" class="highlight" fill="#8b5cf6">训练成本减半</text>
  </g>

  <!-- Arrow down to result -->
  <g class="g5">
    <line x1="480" y1="305" x2="480" y2="340" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  </g>

  <!-- Result -->
  <g class="g6">
    <rect x="200" y="350" width="560" height="80" class="card" stroke="#E8A87C"/>
    <text x="480" y="382" text-anchor="middle" class="label">三项叠加结果</text>
    <text x="480" y="414" text-anchor="middle" font-size="20" font-weight="700" fill="#E8A87C">整体扩展效率提升 ~2.5 倍</text>
  </g>

  <!-- Quote -->
  <g class="g6">
    <rect x="160" y="455" width="640" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="480" y="484" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">"对沿用了八到十一年的 AI 基础机制做了一次系统性的重写" — 杨植麟</text>
  </g>

  <text x="480" y="530" text-anchor="middle" class="small">来源：GTC 2026 演讲 + 月之暗面官方技术材料</text>
</svg>
