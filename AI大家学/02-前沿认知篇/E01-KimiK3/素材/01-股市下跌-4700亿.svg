<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1025"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes drawLine { from { stroke-dashoffset:400; } to { stroke-dashoffset:0; } }
    @keyframes countPulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
    .title { font-size:16px; font-weight:700; fill:#e2e8f0; }
    .number { font-size:48px; font-weight:800; fill:#ef4444; animation: countPulse 3s ease-in-out 2s infinite; }
    .subtitle { font-size:12px; fill:#94a3b8; }
    .label { font-size:11px; fill:#64748b; }
    .g1 { animation: fadeUp 0.8s ease-out 0.5s both; }
    .g2 { animation: fadeUp 0.8s ease-out 1.5s both; }
    .g3 { animation: fadeIn 1.2s ease-out 2.8s both; }
    .chart-line { stroke-dasharray:400; animation: drawLine 2.5s ease-out 3s both; }
  </style>

  <rect width="960" height="540" fill="url(#bg)"/>

  <g class="g1">
    <text x="480" y="50" text-anchor="middle" class="title">72小时内全球科技股市值变化</text>
    <text x="480" y="72" text-anchor="middle" class="label">据多家财经媒体统计</text>
  </g>

  <g class="g2">
    <text x="480" y="150" text-anchor="middle" class="number">-$4,700亿</text>
  </g>

  <g class="g3">
    <line x1="120" y1="200" x2="840" y2="200" stroke="#1e293b" stroke-width="1"/>
    <line x1="120" y1="260" x2="840" y2="260" stroke="#1e293b" stroke-width="1"/>
    <line x1="120" y1="320" x2="840" y2="320" stroke="#1e293b" stroke-width="1"/>
    <line x1="120" y1="380" x2="840" y2="380" stroke="#1e293b" stroke-width="1"/>
    <line x1="120" y1="440" x2="840" y2="440" stroke="#1e293b" stroke-width="1"/>
    <polyline fill="none" stroke="#4ECDC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      class="chart-line"
      points="120,400 180,390 240,375 300,360 360,340 420,320 480,305 510,300 540,310 570,350 620,400 680,430 740,445 800,450 840,452"/>
    <rect x="520" y="290" width="320" height="170" fill="#ef4444" opacity="0.06" rx="4"/>
    <line x1="530" y1="305" x2="530" y2="445" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="545" y="380" font-size="11" fill="#ef4444" opacity="0.7">-4700亿</text>
    <text x="120" y="470" class="label" text-anchor="middle">7月14日</text>
    <text x="360" y="470" class="label" text-anchor="middle">7月16日 · K3发布</text>
    <text x="600" y="470" class="label" text-anchor="middle">7月18日</text>
    <text x="840" y="470" class="label" text-anchor="middle">7月20日</text>
    <line x1="360" y1="200" x2="360" y2="440" stroke="#4ECDC4" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
    <circle cx="360" cy="340" r="4" fill="#4ECDC4"/>
  </g>

  <g class="g3">
    <text x="480" y="510" text-anchor="middle" class="subtitle">华尔街称之为"Kimi时刻"，与2025年初的"DeepSeek时刻"相提并论</text>
  </g>
</svg>
