<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1025"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes scanLine { from { transform:translateX(-100%); } to { transform:translateX(200%); } }
    .title { font-size:16px; font-weight:700; fill:#e2e8f0; }
    .body { font-size:12px; fill:#cbd5e1; }
    .label { font-size:11px; fill:#94a3b8; }
    .small { font-size:10px; fill:#64748b; }
    .card { fill:#1e293b; stroke:#334155; stroke-width:1.5; rx:8; }
    .head { font-size:13px; font-weight:600; }
    .g1 { animation: fadeUp 0.5s ease-out 0.2s both; }
    .g2 { animation: fadeUp 0.5s ease-out 0.5s both; }
    .g3 { animation: fadeUp 0.5s ease-out 0.8s both; }
    .g4 { animation: fadeUp 0.5s ease-out 1.1s both; }
    .scan { animation: scanLine 3s ease-in-out 1.5s infinite; }
  </style>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <g class="g1">
    <text x="480" y="38" text-anchor="middle" class="title">KDA — Kimi Delta Attention 原理</text>
    <text x="480" y="58" text-anchor="middle" class="label">让AI学会"扫读"——重点精读，不重要的快速翻过</text>
  </g>

  <!-- Left: Traditional full attention -->
  <g class="g2">
    <rect x="40" y="80" width="420" height="220" class="card"/>
    <rect x="40" y="80" width="420" height="32" rx="8" fill="#ef4444" opacity="0.08"/>
    <rect x="40" y="80" width="420" height="32" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="102" text-anchor="middle" class="head" fill="#ef4444">传统全注意力 ❌</text>

    <text x="250" y="130" text-anchor="middle" class="label">每个Token都看其他所有Token → O(n²)</text>

    <!-- Attention matrix: all cells filled (dense) -->
    <g transform="translate(100, 148)">
      <g fill="#ef4444" opacity="0.5">
        <rect x="0" y="0" width="24" height="24" rx="3"/><rect x="28" y="0" width="24" height="24" rx="3"/><rect x="56" y="0" width="24" height="24" rx="3"/><rect x="84" y="0" width="24" height="24" rx="3"/><rect x="112" y="0" width="24" height="24" rx="3"/><rect x="140" y="0" width="24" height="24" rx="3"/><rect x="168" y="0" width="24" height="24" rx="3"/><rect x="196" y="0" width="24" height="24" rx="3"/><rect x="224" y="0" width="24" height="24" rx="3"/><rect x="252" y="0" width="24" height="24" rx="3"/>
        <rect x="0" y="28" width="24" height="24" rx="3"/><rect x="28" y="28" width="24" height="24" rx="3"/><rect x="56" y="28" width="24" height="24" rx="3"/><rect x="84" y="28" width="24" height="24" rx="3"/><rect x="112" y="28" width="24" height="24" rx="3"/><rect x="140" y="28" width="24" height="24" rx="3"/><rect x="168" y="28" width="24" height="24" rx="3"/><rect x="196" y="28" width="24" height="24" rx="3"/><rect x="224" y="28" width="24" height="24" rx="3"/><rect x="252" y="28" width="24" height="24" rx="3"/>
        <rect x="0" y="56" width="24" height="24" rx="3"/><rect x="28" y="56" width="24" height="24" rx="3"/><rect x="56" y="56" width="24" height="24" rx="3"/><rect x="84" y="56" width="24" height="24" rx="3"/><rect x="112" y="56" width="24" height="24" rx="3"/><rect x="140" y="56" width="24" height="24" rx="3"/><rect x="168" y="56" width="24" height="24" rx="3"/><rect x="196" y="56" width="24" height="24" rx="3"/><rect x="224" y="56" width="24" height="24" rx="3"/><rect x="252" y="56" width="24" height="24" rx="3"/>
        <rect x="0" y="84" width="24" height="24" rx="3"/><rect x="28" y="84" width="24" height="24" rx="3"/><rect x="56" y="84" width="24" height="24" rx="3"/><rect x="84" y="84" width="24" height="24" rx="3"/><rect x="112" y="84" width="24" height="24" rx="3"/><rect x="140" y="84" width="24" height="24" rx="3"/><rect x="168" y="84" width="24" height="24" rx="3"/><rect x="196" y="84" width="24" height="24" rx="3"/><rect x="224" y="84" width="24" height="24" rx="3"/><rect x="252" y="84" width="24" height="24" rx="3"/>
      </g>
    </g>
    <text x="250" y="285" text-anchor="middle" class="small">文本越长，计算量越爆炸</text>
  </g>

  <!-- Right: KDA sparse attention -->
  <g class="g3">
    <rect x="500" y="80" width="420" height="220" class="card" stroke="#4ECDC4" stroke-width="1.5"/>
    <rect x="500" y="80" width="420" height="32" rx="8" fill="#4ECDC4" opacity="0.08"/>
    <rect x="500" y="80" width="420" height="32" rx="8" fill="none" stroke="#4ECDC4" stroke-width="1.5"/>
    <text x="710" y="102" text-anchor="middle" class="head" fill="#4ECDC4">KDA 混合线性注意力 ✅</text>

    <text x="710" y="130" text-anchor="middle" class="label">不同通道用不同衰减速率管理记忆</text>

    <!-- Attention matrix: sparse - key tokens bright, rest dim -->
    <g transform="translate(560, 148)">
      <!-- Row 1: T1 focuses on T1, T4, T10 -->
      <rect x="0" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.85"/><rect x="28" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="56" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="84" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.5"/><rect x="112" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="140" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="168" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="196" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="224" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="252" y="0" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.7"/>
      <!-- Row 2 -->
      <rect x="0" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="28" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.85"/><rect x="56" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="84" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="112" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.4"/><rect x="140" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="168" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="196" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="224" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="252" y="28" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/>
      <!-- Row 3 -->
      <rect x="0" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="28" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="56" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.85"/><rect x="84" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="112" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="140" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.7"/><rect x="168" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="196" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="224" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="252" y="56" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/>
      <!-- Row 4 -->
      <rect x="0" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.35"/><rect x="28" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="56" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="84" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.85"/><rect x="112" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="140" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="168" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.35"/><rect x="196" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="224" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/><rect x="252" y="84" width="24" height="24" rx="3" fill="#4ECDC4" opacity="0.1"/>
    </g>

    <!-- Scan line animation -->
    <rect x="560" y="148" width="8" height="112" fill="#4ECDC4" opacity="0.15" rx="4" class="scan"/>

    <text x="710" y="285" text-anchor="middle" class="small" fill="#4ECDC4">关键信息精读，噪声快速扫过</text>
  </g>

  <!-- Legend -->
  <g class="g4">
    <rect x="120" y="330" width="720" height="40" class="card"/>
    <rect x="160" y="342" width="18" height="18" rx="3" fill="#4ECDC4" opacity="0.8"/>
    <text x="186" y="356" class="small">= 精读（全注意力）</text>
    <rect x="360" y="342" width="18" height="18" rx="3" fill="#4ECDC4" opacity="0.25"/>
    <text x="386" y="356" class="small">= 扫读（线性注意力）</text>
    <rect x="580" y="342" width="18" height="18" rx="3" fill="#4ECDC4" opacity="0.08"/>
    <text x="606" y="356" class="small">= 极低权重</text>
  </g>

  <!-- Bottom: result -->
  <g class="g4">
    <rect x="120" y="395" width="720" height="100" class="card" stroke="#4ECDC4"/>
    <text x="480" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#4ECDC4">核心效果</text>
    <line x1="160" y1="440" x2="800" y2="440" stroke="#334155" stroke-width="1"/>
    <text x="300" y="468" text-anchor="middle" class="body">上下文窗口扩大 10 倍</text>
    <text x="480" y="468" text-anchor="middle" class="body">推理效率提升 ~25%</text>
    <text x="660" y="468" text-anchor="middle" class="body">+ Attention Residuals</text>
  </g>

  <text x="480" y="525" text-anchor="middle" class="small">来源：月之暗面官方技术报告</text>
</svg>
