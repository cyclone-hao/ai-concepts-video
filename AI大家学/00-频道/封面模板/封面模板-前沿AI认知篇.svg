<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- 前沿AI认知篇 封面模板 -->
  <defs>
    <linearGradient id="frontBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1033"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="frontAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="100%" style="stop-color:#764BA2"/>
    </linearGradient>
    <radialGradient id="frontGlow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#667EEA;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#frontBg)"/>

  <!-- Glow effect -->
  <rect width="1280" height="720" fill="url(#frontGlow)"/>

  <!-- Decorative: scattered stars/dots -->
  <g opacity="0.3">
    <circle cx="100" cy="100" r="2" fill="#667EEA"/>
    <circle cx="250" cy="60" r="1.5" fill="#764BA2"/>
    <circle cx="400" cy="130" r="2.5" fill="#667EEA"/>
    <circle cx="600" cy="50" r="1.5" fill="white"/>
    <circle cx="750" cy="120" r="2" fill="#764BA2"/>
    <circle cx="900" cy="70" r="1.5" fill="#667EEA"/>
    <circle cx="1050" cy="100" r="2" fill="white"/>
    <circle cx="1180" cy="60" r="1.5" fill="#764BA2"/>
    <circle cx="150" cy="620" r="2" fill="#667EEA"/>
    <circle cx="350" cy="650" r="1.5" fill="white"/>
    <circle cx="550" cy="670" r="2" fill="#764BA2"/>
    <circle cx="800" cy="640" r="1.5" fill="#667EEA"/>
    <circle cx="1000" cy="660" r="2" fill="white"/>
    <circle cx="1150" cy="630" r="1.5" fill="#764BA2"/>
  </g>

  <!-- Decorative: timeline/radar lines -->
  <g opacity="0.08" stroke="#667EEA" stroke-width="1">
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <circle cx="640" cy="360" r="200" fill="none"/>
    <circle cx="640" cy="360" r="350" fill="none"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#frontAccent)"/>

  <!-- Series badge (top left) -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="260" height="45" rx="22" fill="#667EEA" opacity="0.2"/>
    <rect x="0" y="0" width="260" height="45" rx="22" fill="none" stroke="#667EEA" stroke-width="2"/>
    <text x="18" y="30" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#667EEA">🔭 前沿AI认知篇</text>
  </g>

  <!-- Hot tag (top right) -->
  <g transform="translate(1100, 30)">
    <rect x="0" y="0" width="130" height="45" rx="22" fill="#FF6B6B" opacity="0.3"/>
    <text x="65" y="30" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#FF6B6B" text-anchor="middle">🔥 热点</text>
  </g>

  <!-- Main title (placeholder) -->
  <text x="640" y="300" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">GPT-5来了！</text>
  <text x="640" y="385" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">和上一代到底差在哪？</text>

  <!-- Subtitle -->
  <text x="640" y="460" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#8899bb" text-anchor="middle">AI世界，快人一步</text>

  <!-- Bottom: channel name -->
  <g transform="translate(50, 645)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="white" opacity="0.1"/>
    <text x="15" y="27" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="white">🎓 AI大家学</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="714" width="1280" height="6" fill="url(#frontAccent)"/>
</svg>