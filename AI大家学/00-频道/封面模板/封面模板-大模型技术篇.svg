<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- 大模型技术篇 封面模板 -->
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#EDE5D5"/>
    </linearGradient>
    <linearGradient id="techAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A87C"/>
      <stop offset="100%" style="stop-color:#D4845C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#techBg)"/>

  <!-- Decorative: concept chain nodes (background) -->
  <g opacity="0.08">
    <!-- Chain of connected nodes representing the 13 concepts -->
    <circle cx="120" cy="360" r="30" fill="#8B6F47"/>
    <circle cx="240" cy="280" r="25" fill="#8B6F47"/>
    <circle cx="350" cy="400" r="20" fill="#8B6F47"/>
    <circle cx="460" cy="300" r="22" fill="#8B6F47"/>
    <circle cx="570" cy="380" r="28" fill="#8B6F47"/>
    <circle cx="700" cy="260" r="24" fill="#8B6F47"/>
    <circle cx="820" cy="420" r="20" fill="#8B6F47"/>
    <circle cx="940" cy="300" r="26" fill="#8B6F47"/>
    <circle cx="1060" cy="380" r="22" fill="#8B6F47"/>
    <circle cx="1170" cy="280" r="30" fill="#8B6F47"/>
    <!-- Connections -->
    <line x1="150" y1="360" x2="215" y2="280" stroke="#8B6F47" stroke-width="2"/>
    <line x1="265" y1="280" x2="330" y2="400" stroke="#8B6F47" stroke-width="2"/>
    <line x1="370" y1="400" x2="438" y2="300" stroke="#8B6F47" stroke-width="2"/>
    <line x1="482" y1="300" x2="542" y2="380" stroke="#8B6F47" stroke-width="2"/>
    <line x1="598" y1="380" x2="676" y2="260" stroke="#8B6F47" stroke-width="2"/>
    <line x1="724" y1="260" x2="800" y2="420" stroke="#8B6F47" stroke-width="2"/>
    <line x1="840" y1="420" x2="914" y2="300" stroke="#8B6F47" stroke-width="2"/>
    <line x1="966" y1="300" x2="1038" y2="380" stroke="#8B6F47" stroke-width="2"/>
    <line x1="1082" y1="380" x2="1140" y2="280" stroke="#8B6F47" stroke-width="2"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#techAccent)"/>

  <!-- Series badge (top left) -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="260" height="45" rx="22" fill="#E8A87C" opacity="0.2"/>
    <rect x="0" y="0" width="260" height="45" rx="22" fill="none" stroke="#D4845C" stroke-width="2"/>
    <text x="18" y="30" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#D4845C">🧩 大模型技术篇</text>
  </g>

  <!-- Episode number (top right) -->
  <g transform="translate(1130, 30)">
    <rect x="0" y="0" width="100" height="45" rx="22" fill="#E8A87C" opacity="0.3"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#5D4E37" text-anchor="middle">E01</text>
  </g>

  <!-- Main title -->
  <text x="640" y="280" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="bold" fill="#5D4E37" text-anchor="middle">从GPT到Agent</text>
  <text x="640" y="365" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="bold" fill="#5D4E37" text-anchor="middle">一期视频打通底层逻辑</text>

  <!-- Subtitle -->
  <text x="640" y="440" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#8B7D6B" text-anchor="middle">13个AI核心概念 · 完整递进链讲解</text>

  <!-- Concept tags row -->
  <g transform="translate(200, 500)">
    <rect x="0" y="0" width="80" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="40" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">LLM</text>

    <rect x="95" y="0" width="85" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="137" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">Token</text>

    <rect x="195" y="0" width="110" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="250" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">Embedding</text>

    <rect x="320" y="0" width="70" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="355" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">RAG</text>

    <rect x="405" y="0" width="70" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="440" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">MCP</text>

    <rect x="490" y="0" width="85" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="532" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">Agent</text>

    <rect x="590" y="0" width="120" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="650" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">Agent Skill</text>

    <rect x="725" y="0" width="150" height="32" rx="16" fill="#E8A87C" opacity="0.2"/>
    <text x="800" y="22" font-family="'PingFang SC', sans-serif" font-size="14" fill="#8B6F47" text-anchor="middle">Harness Eng</text>
  </g>

  <!-- Bottom: channel name -->
  <g transform="translate(50, 645)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#5D4E37" opacity="0.1"/>
    <text x="15" y="27" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#5D4E37">🎓 AI大家学</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="714" width="1280" height="6" fill="url(#techAccent)"/>
</svg>